<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>玄不救非 · 赛博天机</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --purple: #9d4edd;
    --pink: #e040fb;
    --card-bg: rgba(15, 5, 30, 0.85);
  }
  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: var(--bg);
    color: #e0d0f0;
    font-family: "Microsoft YaHei","PingFang SC","Helvetica Neue",sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }

  #bgCanvas { position:fixed; top:0; left:0; width:100%; height:100%; z-index:0; pointer-events:none; }

  .main {
    position:relative; z-index:2; text-align:center; padding:20px;
    width:100%; max-width:700px;
  }

  .title {
    font-family:'Orbitron','Microsoft YaHei',sans-serif;
    font-size:clamp(26px,5vw,40px); font-weight:900; letter-spacing:4px;
    color:#fff;
    text-shadow:0 0 10px var(--purple),0 0 30px var(--purple),0 0 60px rgba(157,78,221,0.5);
    margin-bottom:6px;
    animation:titleGlow 2s ease-in-out infinite alternate;
  }
  @keyframes titleGlow {
    from { text-shadow:0 0 10px var(--purple),0 0 30px var(--purple),0 0 60px rgba(157,78,221,0.5); }
    to   { text-shadow:0 0 20px var(--purple),0 0 50px var(--pink),0 0 80px rgba(224,64,251,0.6); }
  }
  .subtitle {
    font-family:'Orbitron',sans-serif;
    font-size:clamp(10px,1.8vw,13px); letter-spacing:6px;
    color:rgba(160,144,192,0.6); margin-bottom:40px;
  }

  .cards {
    display:flex; gap:24px; justify-content:center; align-items:stretch;
  }

  .card {
    flex:1; min-width:0; max-width:280px;
    background:var(--card-bg);
    border:1px solid rgba(157,78,221,0.2);
    border-radius:20px; padding:36px 24px 28px;
    cursor:pointer; text-decoration:none; color:inherit;
    transition:transform 0.35s cubic-bezier(.34,1.56,.64,1), box-shadow 0.35s, border-color 0.35s;
    position:relative; overflow:hidden;
    opacity:0; transform:translateY(40px);
    animation:fadeInUp 0.7s ease forwards;
  }
  .card-left  { animation-delay:0.1s; }
  .card-right { animation-delay:0.3s; }
  @keyframes fadeInUp {
    to { opacity:1; transform:translateY(0); }
  }

  .card::before {
    content:''; position:absolute; top:0; left:0; width:100%; height:100%;
    background:radial-gradient(ellipse at 50% 0%, rgba(157,78,221,0.1) 0%, transparent 70%);
    opacity:0; transition:opacity 0.35s;
  }

  .card:hover {
    transform:translateY(-10px);
    box-shadow:0 0 30px rgba(157,78,221,0.3),0 0 60px rgba(224,64,251,0.15),0 10px 40px rgba(0,0,0,0.5);
  }
  .card:hover::before { opacity:1; }
  .card:active { transform:scale(0.95) translateY(-5px); transition:transform 0.1s; }

  .card-icon {
    font-size:clamp(40px,7vw,56px); margin-bottom:12px;
    position:relative; z-index:1; display:block;
    transition:transform 0.35s;
  }
  .card:hover .card-icon { transform:scale(1.1); }

  .card-label {
    font-family:'Orbitron','Microsoft YaHei',sans-serif;
    font-size:clamp(16px,2.5vw,20px); font-weight:700; letter-spacing:3px;
    position:relative; z-index:1;
    transition:text-shadow 0.35s;
  }
  .card:hover .card-label { text-shadow:0 0 12px var(--purple); }

  .card-desc {
    font-size:12px; color:#706090; margin-top:6px;
    position:relative; z-index:1; transition:color 0.35s;
  }
  .card:hover .card-desc { color:#b090d0; }

  .card-left:hover  { border-color:rgba(157,78,221,0.7); }
  .card-right:hover { border-color:rgba(240,192,64,0.7); box-shadow:0 0 30px rgba(240,192,64,0.3),0 0 60px rgba(240,192,64,0.15),0 10px 40px rgba(0,0,0,0.5); }

  .footer {
    margin-top:36px; font-size:11px; color:rgba(120,100,150,0.4);
    letter-spacing:1px;
  }

  /* Toast */
  .toast {
    position:fixed; bottom:40px; left:50%; transform:translateX(-50%);
    background:rgba(30,10,50,0.95); color:#e0d0f0;
    padding:12px 24px; border-radius:30px; font-size:14px;
    border:1px solid rgba(224,64,251,0.4);
    box-shadow:0 0 20px rgba(224,64,251,0.2);
    z-index:999; opacity:0; pointer-events:none;
    transition:opacity 0.4s, transform 0.4s;
    transform:translateX(-50%) translateY(20px);
  }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  @media (max-width:560px) {
    .cards { flex-direction:column; align-items:center; gap:16px; }
    .card { max-width:320px; width:100%; padding:28px 20px 22px; }
    .card:hover { transform:translateY(-6px); }
    .card:active { transform:scale(0.97) translateY(-3px); }
  }
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<div class="main">
  <h1 class="title">玄不救非 · 赛博天机</h1>
  <p class="subtitle">// CYBER_FORTUNE_ENGINE //</p>

  <div class="cards">
    <a class="card card-left" href="fortune.html">
      <span class="card-icon">🔮</span>
      <div class="card-label">赛 博 算 命</div>
      <div class="card-desc">AI 紫微斗数 · 即时起卦</div>
    </a>

    <a class="card card-right" href="lottery.html" id="cardLottery">
      <span class="card-icon">🏮</span>
      <div class="card-label">抽　　　签</div>
      <div class="card-desc">观音灵签 · 每日一签</div>
    </a>
  </div>

  <p class="footer">仅供娱乐，切勿当真 · 数据存储在本地</p>
</div>

<div class="toast" id="toast"></div>

<script>
// ============================================================
// Canvas 背景 —— 粒子 + 连线
// ============================================================
(function() {
  var c = document.getElementById('bgCanvas');
  var ctx = c.getContext('2d');
  var w, h;
  var particles = [];
  var COUNT = 50;
  var CONNECT = 140;

  function resize() {
    w = c.width = window.innerWidth;
    h = c.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  for (var i = 0; i < COUNT; i++) {
    particles.push({
      x: Math.random() * w,
      y: Math.random() * h,
      vx: (Math.random() - 0.5) * 0.4,
      vy: (Math.random() - 0.5) * 0.4,
      r: Math.random() * 1.2 + 0.3,
      a: Math.random() * 0.5 + 0.2
    });
  }

  function draw() {
    ctx.clearRect(0, 0, w, h);
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      p.x += p.vx; p.y += p.vy;
      if (p.x < 0) p.x = w; if (p.x > w) p.x = 0;
      if (p.y < 0) p.y = h; if (p.y > h) p.y = 0;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(157,78,221,' + p.a + ')';
      ctx.fill();
    }
    for (var i = 0; i < particles.length; i++) {
      for (var j = i + 1; j < particles.length; j++) {
        var dx = particles[i].x - particles[j].x;
        var dy = particles[i].y - particles[j].y;
        var dist = Math.sqrt(dx * dx + dy * dy);
        if (dist < CONNECT) {
          ctx.beginPath();
          ctx.moveTo(particles[i].x, particles[i].y);
          ctx.lineTo(particles[j].x, particles[j].y);
          ctx.strokeStyle = 'rgba(157,78,221,' + ((1 - dist / CONNECT) * 0.12) + ')';
          ctx.lineWidth = 0.5;
          ctx.stroke();
        }
      }
    }
    requestAnimationFrame(draw);
  }
  draw();
})();

// ============================================================
// 抽签功能检测
// ============================================================
(function() {
  var card = document.getElementById('cardLottery');
  var toast = document.getElementById('toast');
  var timer = null;

  function show(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(timer);
    timer = setTimeout(function() { toast.classList.remove('show'); }, 2500);
  }

  card.addEventListener('click', function(e) {
    e.preventDefault();
    fetch('lottery.html', { method: 'HEAD' })
      .then(function(res) {
        if (res.ok) { window.location.href = 'lottery.html'; }
        else { show('🏮 该功能尚在开发中，敬请期待'); }
      })
      .catch(function() { show('🏮 该功能尚在开发中，敬请期待'); });
  });
})();
</script>

</body>
</html>
