<style>
  :root {
    --bg: #0a0012; --card-bg: rgba(20, 5, 40, 0.92);

    --text: #e0d8f0; --sub: #a090c0; --red: #ff5577; --green: #55ddaa;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    overflow-x: hidden;
  }
  .stars { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; }
  .star {
    position:absolute; background:white; border-radius:50%;
    animation:twinkle var(--dur) ease-in-out infinite; animation-delay:var(--delay);
    opacity:0;
  }
  @keyframes twinkle {
    0%,100% { opacity:0.2; transform:scale(1); } 50% { opacity:1; transform:scale(1.8); }
  }
  .container { position:relative; z-index:1; width:100%; max-width:480px; margin:16px; }
  .card {
    background:var(--card-bg); border:1px solid rgba(155,48,255,0.3);
    border-radius:20px; padding:28px 24px; backdrop-filter:blur(10px);
    box-shadow:0 0 60px rgba(155,48,255,0.15);
  }
  .title { text-align:center; margin-bottom:4px; }
  .title .icon-row { font-size:26px; letter-spacing:2px; animation:float 3s ease-in-out infinite; }
  .title h1 {
    font-size:20px; font-weight:700; line-height:1.3;
    background:linear-gradient(135deg,#c77dff,#9b30ff,#7b2fff);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  }
  .title .sub { font-size:12px; color:var(--sub); margin-top:2px; }
  .title .badge {
    display:inline-block; margin-top:6px; padding:3px 10px; border-radius:20px;
    font-size:11px; background:rgba(85,221,170,0.15); color:var(--green);
    border:1px solid rgba(85,221,170,0.25);
  }
  @keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-8px); } }
  .form-group { margin-bottom:14px; }
  .form-group label { display:block; font-size:13px; color:var(--sub); margin-bottom:5px; font-weight:500; }
  .form-group input {
    width:100%; padding:12px 14px; background:rgba(255,255,255,0.05);
    border:1px solid rgba(155,48,255,0.25); border-radius:12px;
    color:var(--text); font-size:15px; outline:none; transition:all 0.3s;
    -webkit-appearance:none;
  }
  .form-group input:focus { border-color:var(--purple); box-shadow:0 0 20px rgba(155,48,255,0.2); }
  .form-group input::placeholder { color:rgba(160,144,192,0.35); }
  .btn-primary {
    width:100%; padding:14px; border:none; border-radius:14px;
    font-size:16px; font-weight:600; cursor:pointer; transition:all 0.3s; letter-spacing:2px;
    background:linear-gradient(135deg,#9b30ff,#7b2fff); color:white;
    box-shadow:0 4px 24px rgba(155,48,255,0.4);
    -webkit-tap-highlight-color:transparent;
  }
  .btn-primary:hover { transform:translateY(-2px); box-shadow:0 6px 32px rgba(155,48,255,0.6); }
  .btn-primary:active { transform:scale(0.97); }
  .btn-primary:disabled { opacity:0.5; cursor:not-allowed; transform:none; }
  .btn-secondary {
    width:100%; padding:13px; border:none; border-radius:14px;
    font-size:15px; font-weight:600; cursor:pointer; transition:all 0.3s;
    background:rgba(255,255,255,0.06); color:var(--sub); margin-top:8px;
  }
  .btn-secondary:hover { background:rgba(255,255,255,0.12); }

  .loading { display:none; text-align:center; padding:16px 0; }
  .loading.active { display:block; }
  .crystal {
    width:52px; height:52px; margin:0 auto 10px;
    border:4px solid rgba(155,48,255,0.2); border-top-color:var(--purple);
    border-radius:50%; animation:spin 1s linear infinite;
  }
  @keyframes spin { to { transform:rotate(360deg); } }
  .loading p { color:var(--sub); font-size:13px; }

  .result { display:none; margin-top:16px; }
  .result.active { display:block; }
  .result-line {
    padding:10px 14px; margin-bottom:6px; border-radius:12px;
    background:rgba(255,255,255,0.03); border-left:3px solid var(--purple);
    font-size:14px; line-height:1.55;
    opacity:0; transform:translateY(12px);
    animation:slideIn 0.4s ease forwards;
  }
  .result-line:nth-child(1){animation-delay:0.1s;border-left-color:#f0c040}
  .result-line:nth-child(2){animation-delay:0.2s;border-left-color:#5b9eff}
  .result-line:nth-child(3){animation-delay:0.3s;border-left-color:#ff7eb6}
  .result-line:nth-child(4){animation-delay:0.4s;border-left-color:#55ddaa}
  .result-line:nth-child(5){animation-delay:0.5s;border-left-color:#00e5ff}
  .result-line:nth-child(6){animation-delay:0.6s;border-left-color:#ff5577}
  @keyframes slideIn { to { opacity:1; transform:translateY(0); } }
  .error-msg { color:#ff5577; text-align:center; padding:14px; font-size:14px; }

  .footer { text-align:center; margin-top:14px; font-size:11px; color:rgba(160,144,192,0.35); line-height:1.6; }

  "烦躁": ["水逆退散符已发送！今天运势有惊喜哦～","烦躁的时候适合一个人静静，运势不差。","放松一点，今天不适合硬刚，适合躺平。"]
};

// ============================================================
// 核心算法
// ============================================================

function moodCategory(mood) {
  var m = mood.trim().toLowerCase();
  var map = {
    "开心":"开心","高兴":"开心","快乐":"开心","爽":"开心","happy":"开心","好":"开心",
    "积极":"积极","加油":"积极","冲":"积极","努力":"积极",
    "平静":"平静","淡定":"平静","佛系":"平静","随便":"平静",
    "低落":"低落","难过":"低落","伤心":"低落","sad":"低落","emo":"低落",
    "焦虑":"焦虑","紧张":"焦虑","慌":"焦虑","急":"焦虑",
    "烦躁":"烦躁","烦":"烦躁","累":"烦躁","困":"烦躁",
    "好奇":"积极","期待":"积极","迷茫":"低落","无聊":"平静"
  };
  for (var kw in map) {
    if (m.indexOf(kw) !== -1) return map[kw];
  }
  if (mood.trim().length <= 2) return "平静";
  if (/[好棒赞爱喜欢]/.test(m)) return "开心";
  if (/[累困烦糟糕烂]/.test(m)) return "烦躁";
  return "平静";
}

// 简易 hash 函数
function hashStr(s) {
  var h = 0;
  for (var i = 0; i < s.length; i++) {
    h = ((h << 5) - h + s.charCodeAt(i)) | 0;
  }
  return Math.abs(h);
}

// 基于种子的伪随机选择
function pick(arr, seed, idx) {
  return arr[(seed + idx * 131) % arr.length];
}

function shuffle(arr, seed) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = (seed * (i + 1) * 31) % (i + 1);
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function starsStr(n) {
  var s = "";
  for (var i = 0; i < 5; i++) s += (i < n) ? "★" : "☆";
  return s;
}

// ============================================================
// 命理引擎
// ============================================================

function generateFortune(name, birthday, mood) {
  var seed = hashStr(name + "|" + birthday);
  var mcat = moodCategory(mood);

  // 生肖
  var dt = new Date(birthday + "T00:00:00");
  var year = dt.getFullYear();
  var month = dt.getMonth() + 1;
  var day = dt.getDate();
  var zodiac = ["猴","鸡","狗","猪","鼠","牛","虎","兔","龙","蛇","马","羊"];
  var animal = zodiac[year % 12];

  // 宿曜 (day of week based)
  var dayXiuList = ["日曜","月曜","火曜","水曜","木曜","金曜","土曜"];
  var dayXiu = dayXiuList[dt.getDay()];

  // 根据生日选一个"主导星"——不是真的紫微斗数，但能让每天都不同
  var starPool = ["紫微","天机","太阳","武曲","天同","廉贞","天府","太阴","贪狼","巨门","天相","天梁","七杀","破军"];
  // 用生日天数 + 年份混合选择
  var dayOfYear = Math.floor((dt - new Date(year, 0, 0)) / 86400000);
  var starIdx = (dayOfYear * 7 + year * 3 + month * 11 + day * 17) % starPool.length;
  var mainStar = starPool[starIdx];

  var info = STAR_PERSONALITY[mainStar] || ["","命运自成一格，与众不同。",3];

  // 星级 (基于月份+日期混合)
  var ratingBase = info[2];
  var ratingMod = (dayOfYear + hashStr(name) % 31) % 3 - 1; // -1, 0, +1
  var rating = Math.max(2, Math.min(5, ratingBase + ratingMod));
  var stars = starsStr(rating);

  // 事业/财运/桃花——从不同偏移量取星
  var careerStar = starPool[(starIdx + 3) % starPool.length];
  var wealthStar = starPool[(starIdx + 5) % starPool.length];
  var loveStar = starPool[(starIdx + 7) % starPool.length];

  // 心情加持
  var boosts = MOOD_BOOST[mcat] || ["🌟 今天运势不错，保持好心情！","🍀 吉星高照！","✨ 命运在自己手中！"];
  var moodLine = boosts[hashStr(mood + "boost") % boosts.length];

  // 宜/忌 —— 用心情做偏移，不同心情不同结果，同一个人也不会重复
  var moodSeed = hashStr(mood);
  var shuffledDo = shuffle(DO_ACTIONS, seed + moodSeed);
  var shuffledDont = shuffle(DONT_ACTIONS, seed + moodSeed + 777);
  // 取第3-4个而不是第1-2个，不同心情偏移不同位置
  var moodOffset = moodSeed % 20;
  var doItems = [shuffledDo[moodOffset % shuffledDo.length], shuffledDo[(moodOffset + 7) % shuffledDo.length]];
  var dontItems = [shuffledDont[(moodOffset + 3) % shuffledDont.length], shuffledDont[(moodOffset + 11) % shuffledDont.length]];

  // 综合运势行
  var yunshiLine = "🌟 今日综合运势：" + info[1] + " " + stars;

  var lines = [
    yunshiLine,
    "💼 事业/学业运：" + (STAR_CAREER[careerStar] || "今天适合按自己的节奏来，不卷也不躺。"),
    "💕 桃花运：" + (STAR_LOVE[loveStar] || "桃花运势平稳，随缘就好。"),
    "💰 财运：" + (STAR_WEALTH[wealthStar] || "财运平稳，不奢求暴富但求安心。"),
    "✅ 宜：" + doItems.join("，"),
    "❌ 忌：" + dontItems.join("，"),
    "📿 " + moodLine
  ];

  return lines.join("\n");
}

// ============================================================
// UI 逻辑
// ============================================================

var form = document.getElementById('fortuneForm');
var loading = document.getElementById('loading');
var result = document.getElementById('result');
var submitBtn = document.getElementById('submitBtn');
var retryBtn = document.getElementById('retryBtn');

form.addEventListener('submit', function(e) {
  e.preventDefault();
  var name = document.getElementById('name').value.trim();
  var birthday = document.getElementById('birthday').value.trim();
  var mood = document.getElementById('mood').value.trim();

  if (!name || !birthday || !mood) {
    showError("姓名、生日、心情都要填哦～");
    return;
  }
  if (!/^\d{4}-\d{2}-\d{2}$/.test(birthday)) {
    showError("日期格式不对，请用 YYYY-MM-DD，如 1995-08-15");
    return;
  }
  // 验证日期有效性
  var dt = new Date(birthday + "T00:00:00");
  if (isNaN(dt.getTime())) {
    showError("请输入有效的日期");
    return;
  }

  result.className = 'result'; result.innerHTML = '';
  retryBtn.style.display = 'none';
  loading.classList.add('active');
  submitBtn.disabled = true;

  // 模拟计算延迟（让动画可见）
  setTimeout(function() {
    try {
      var fortune = generateFortune(name, birthday, mood);
      loading.classList.remove('active');
      submitBtn.disabled = false;
      result.className = 'result active';

      var html = '';
      var lines = fortune.trim().split('\n');
      lines.forEach(function(line) {
        var t = line.trim();
        if (t) html += '<div class="result-line">' + escapeHtml(t) + '</div>';
      });
      result.innerHTML = html;
      retryBtn.style.display = 'block';
    } catch (err) {
      loading.classList.remove('active');
      submitBtn.disabled = false;
      showError("算命出错，请重试～");
    }
  }, 600);
});

retryBtn.addEventListener('click', function(){
  result.className = 'result'; result.innerHTML = '';
  retryBtn.style.display = 'none';
  form.reset();
  document.getElementById('name').focus();
});

function showError(msg) {
  result.className = 'result active';
  result.innerHTML = '<div class="error-msg">⚠ ' + escapeHtml(msg) + '</div>';
  retryBtn.style.display = 'block';
}

function escapeHtml(text) {
  var d = document.createElement('div');
  d.textContent = text;
  return d.innerHTML;
}
</script>
