<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>玄不救非 · AI算命大师</title>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js">
</script>
<style>
  :root {
    --bg: #0a0012; --card-bg: rgba(20, 5, 40, 0.92);
    --purple: #9b30ff; --gold: #f0c040; --cyan: #00e5ff;
    --text: #e0d8f0; --sub: #a090c0; --red: #ff5577; --green: #55ddaa;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: "Microsoft YaHei", "PingFang SC", "Helvetica Neue", sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    overflow-x: hidden;
  }
  .stars { position:fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; }
  .star {
    position:absolute; background:white; border-radius:50%;
    animation:twinkle var(--dur) ease-in-out infinite; animation-delay:var(--delay);
    opacity:0;
  }
  @keyframes twinkle {
    0%,100% { opacity:0.2; transform:scale(1); } 50% { opacity:1; transform:scale(1.8); }
  }
  .container { position:relative; z-index:1; width:100%; max-width:480px; margin:16px; }
  .card {
    background:var(--card-bg); border:1px solid rgba(155,48,255,0.3);
    border-radius:20px; padding:28px 24px; backdrop-filter:blur(10px);
    box-shadow:0 0 60px rgba(155,48,255,0.15);
  }
  .title { text-align:center; margin-bottom:4px; }
  .title .icon-row { font-size:26px; letter-spacing:2px; animation:float 3s ease-in-out infinite; }
  .title h1 {
    font-size:20px; font-weight:700; line-height:1.3;
    background:linear-gradient(135deg,#c77dff,#9b30ff,#7b2fff);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  }
  .title .sub { font-size:12px; color:var(--sub); margin-top:2px; }
  .title .badge {
    display:inline-block; margin-top:6px; padding:3px 10px; border-radius:20px;
    font-size:11px; background:rgba(85,221,170,0.15); color:var(--green);
    border:1px solid rgba(85,221,170,0.25);
  }
  @keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-8px); } }
  .form-group { margin-bottom:14px; }
  .form-group label { display:block; font-size:13px; color:var(--sub); margin-bottom:5px; font-weight:500; }
  .form-group input {
    width:100%; padding:12px 14px; background:rgba(255,255,255,0.05);
    border:1px solid rgba(155,48,255,0.25); border-radius:12px;
    color:var(--text); font-size:15px; outline:none; transition:all 0.3s;
    -webkit-appearance:none;
  }
  .form-group input:focus { border-color:var(--purple); box-shadow:0 0 20px rgba(155,48,255,0.2); }
  .form-group input::placeholder { color:rgba(160,144,192,0.35); }
  .btn-primary {
    width:100%; padding:14px; border:none; border-radius:14px;
    font-size:16px; font-weight:600; cursor:pointer; transition:all 0.3s; letter-spacing:2px;
    background:linear-gradient(135deg,#9b30ff,#7b2fff); color:white;
    box-shadow:0 4px 24px rgba(155,48,255,0.4);
    -webkit-tap-highlight-color:transparent;
  }
  .btn-primary:hover { transform:translateY(-2px); box-shadow:0 6px 32px rgba(155,48,255,0.6); }
  .btn-primary:active { transform:scale(0.97); }
  .btn-primary:disabled { opacity:0.5; cursor:not-allowed; transform:none; }
  .btn-secondary {
    width:100%; padding:13px; border:none; border-radius:14px;
    font-size:15px; font-weight:600; cursor:pointer; transition:all 0.3s;
    background:rgba(255,255,255,0.06); color:var(--sub); margin-top:8px;
  }
  .btn-secondary:hover { background:rgba(255,255,255,0.12); }

  .loading { display:none; text-align:center; padding:12px 0 8px; }
  .loading.active { display:block; }

  /* 水晶球容器 */
  .crystal-stage { position:relative; width:120px; height:120px; margin:0 auto 8px; }
  /* 外层光晕 */
  .crystal-aura {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:100px; height:100px; border-radius:50%;
    background:radial-gradient(circle, rgba(155,48,255,0.3) 0%, rgba(0,229,255,0.1) 40%, transparent 70%);
    animation:auraPulse 1.4s ease-in-out infinite;
  }
  @keyframes auraPulse {
    0%,100% { transform:translate(-50%,-50%) scale(0.8); opacity:0.4; }
    50% { transform:translate(-50%,-50%) scale(1.5); opacity:1; }
  }
  /* 水晶球主体 */
  .crystal-ball {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:64px; height:64px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, rgba(200,255,255,0.7) 0%, rgba(120,80,220,0.5) 30%, rgba(40,10,80,0.9) 70%, rgba(10,0,30,1) 100%);
    box-shadow:
      0 0 30px rgba(155,48,255,0.6),
      0 0 60px rgba(0,229,255,0.3),
      inset 0 0 20px rgba(255,255,255,0.2);
    animation:ballGlow 1.8s ease-in-out infinite;
    z-index:2;
  }
  @keyframes ballGlow {
    0%,100% { box-shadow:0 0 30px rgba(155,48,255,0.6),0 0 60px rgba(0,229,255,0.3),inset 0 0 20px rgba(255,255,255,0.2); }
    50% { box-shadow:0 0 50px rgba(200,60,255,0.9),0 0 90px rgba(0,229,255,0.6),inset 0 0 35px rgba(255,255,255,0.4); }
  }
  /* 水晶球内部亮斑 */
  .crystal-ball::after {
    content:''; position:absolute; top:22%; left:25%;
    width:18px; height:14px; border-radius:50%;
    background:rgba(255,255,255,0.7);
    transform:rotate(-20deg);
    animation:highlightShift 2s ease-in-out infinite;
  }
  @keyframes highlightShift {
    0%,100% { top:22%; left:25%; opacity:0.7; }
    50% { top:28%; left:30%; opacity:0.9; }
  }
  /* 旋转符文环 */
  .rune-ring {
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    width:90px; height:90px; z-index:3;
    animation:runeSpin 8s linear infinite;
  }
  @keyframes runeSpin { to { transform:translate(-50%,-50%) rotate(360deg); } }
  .rune-char {
    position:absolute; left:50%; top:0;
    font-size:13px; color:var(--gold);
    text-shadow:0 0 8px rgba(240,192,64,0.8);
    transform:translateX(-50%);
    opacity:0.7;
    animation:runeFlicker 1.5s ease-in-out infinite;
  }
  .rune-char:nth-child(1){animation-delay:0s}
  .rune-char:nth-child(2){animation-delay:0.15s}
  .rune-char:nth-child(3){animation-delay:0.3s}
  .rune-char:nth-child(4){animation-delay:0.45s}
  .rune-char:nth-child(5){animation-delay:0.6s}
  .rune-char:nth-child(6){animation-delay:0.75s}
  .rune-char:nth-child(7){animation-delay:0.9s}
  .rune-char:nth-child(8){animation-delay:1.05s}
  @keyframes runeFlicker {
    0%,100% { opacity:0.4; text-shadow:0 0 4px rgba(240,192,64,0.4); }
    50% { opacity:1; text-shadow:0 0 14px rgba(240,192,64,1); }
  }
  /* 粒子 */
  .spark {
    position:absolute; width:3px; height:3px; background:var(--cyan);
    border-radius:50%; z-index:4;
    animation:sparkFloat 2s ease-in-out infinite;
  }
  @keyframes sparkFloat {
    0% { transform:translate(0,0) scale(1); opacity:0; }
    30% { opacity:1; }
    70% { opacity:1; }
    100% { transform:translate(var(--sx),var(--sy)) scale(0); opacity:0; }
  }
  /* 符文逐字浮现 */
  .rune-text {
    position:relative; z-index:5; margin-top:4px;
    display:flex; justify-content:center; gap:8px; flex-wrap:wrap;
  }
  .rune-text span {
    display:inline-block; font-size:16px; color:var(--gold);
    text-shadow:0 0 10px rgba(240,192,64,0.6);
    opacity:0; transform:translateY(8px);
    animation:runeAppear 0.5s ease forwards;
  }
  @keyframes runeAppear {
    to { opacity:1; transform:translateY(0); }
  }
  /* 加载文字 */
  .loading-msg { color:var(--sub); font-size:13px; margin-top:6px; position:relative; z-index:5; }
  .loading-msg .dots::after {
    content:''; animation:dots 1.4s steps(4,end) infinite;
  }
  @keyframes dots {
    0% { content:''; } 25% { content:'.'; } 50% { content:'..'; } 75% { content:'...'; } 100% { content:''; }
  }

  .result { display:none; margin-top:16px; }
  .result.active { display:block; }
  .result-line {
    padding:10px 14px; margin-bottom:6px; border-radius:12px;
    background:rgba(255,255,255,0.03); border-left:3px solid var(--purple);
    font-size:14px; line-height:1.55;
    opacity:0; transform:translateY(12px);
    animation:slideIn 0.4s ease forwards;
  }
  .result-line:nth-child(1){animation-delay:0.1s;border-left-color:#f0c040}
  .result-line:nth-child(2){animation-delay:0.2s;border-left-color:#5b9eff}
  .result-line:nth-child(3){animation-delay:0.3s;border-left-color:#ff7eb6}
  .result-line:nth-child(4){animation-delay:0.4s;border-left-color:#55ddaa}
  .result-line:nth-child(5){animation-delay:0.5s;border-left-color:#00e5ff}
  .result-line:nth-child(6){animation-delay:0.6s;border-left-color:#ff5577}
  @keyframes slideIn { to { opacity:1; transform:translateY(0); } }
  .error-msg { color:#ff5577; text-align:center; padding:14px; font-size:14px; }

  .footer { text-align:center; margin-top:14px; font-size:11px; color:rgba(160,144,192,0.35); line-height:1.6; }

  /* ====== 海报样式 ====== */
  #posterWrap { position:fixed; left:-9999px; top:0; z-index:-1; }
  .poster {
    width:420px; padding:0; font-family:"Microsoft YaHei","PingFang SC",sans-serif;
    color:#e0d8f0; position:relative; overflow:hidden;
    background:linear-gradient(180deg, #0d0018 0%, #150528 40%, #0a0020 100%);
  }
  /* 装饰边框 */
  .poster-border {
    position:absolute; top:10px; left:10px; right:10px; bottom:10px;
    border:2px solid rgba(240,192,64,0.5);
    border-radius:4px; pointer-events:none; z-index:2;
    box-shadow:inset 0 0 40px rgba(155,48,255,0.15);
  }
  .poster-border::before {
    content:''; position:absolute; top:-2px; left:-2px; right:-2px; bottom:-2px;
    border:1px solid rgba(240,192,64,0.2); border-radius:5px;
  }
  /* 四角装饰 */
  .poster-corner {
    position:absolute; width:20px; height:20px; z-index:3;
    border-color:var(--gold); border-style:solid;
  }
  .pc-tl { top:10px; left:10px; border-width:3px 0 0 3px; border-radius:4px 0 0 0; }
  .pc-tr { top:10px; right:10px; border-width:3px 3px 0 0; border-radius:0 4px 0 0; }
  .pc-bl { bottom:10px; left:10px; border-width:0 0 3px 3px; border-radius:0 0 0 4px; }
  .pc-br { bottom:10px; right:10px; border-width:0 3px 3px 0; border-radius:0 0 4px 0; }
  /* 背景星星 */
  .poster-stars { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:0; }
  .poster-star {
    position:absolute; background:white; border-radius:50%;
    opacity:0; animation:psTwinkle var(--pdur) ease-in-out infinite;
    animation-delay:var(--pdelay);
  }
  @keyframes psTwinkle {
    0%,100%{opacity:0.1} 50%{opacity:0.7}
  }
  /* 内容区 */
  .poster-inner { position:relative; z-index:4; padding:28px 26px 24px; }
  .poster-header { text-align:center; margin-bottom:16px; }
  .poster-header .ph-icon { font-size:32px; letter-spacing:4px; margin-bottom:4px; }
  .poster-header .ph-title {
    font-size:22px; font-weight:700;
    background:linear-gradient(135deg,#f0d080,#c89030,#f0d080);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  }
  .poster-header .ph-divider {
    width:80px; height:1px; margin:8px auto;
    background:linear-gradient(90deg,transparent,rgba(240,192,64,0.6),transparent);
  }
  .poster-meta {
    text-align:center; font-size:13px; color:#a090c0; margin-bottom:18px;
    line-height:1.8;
  }
  .poster-meta .ph-name { font-size:16px; color:#f0c040; font-weight:600; }
  .poster-fortune { margin-bottom:12px; }
  .poster-line {
    padding:9px 14px; margin-bottom:5px; border-radius:8px;
    background:rgba(255,255,255,0.04); border-left:3px solid var(--purple);
    font-size:13px; line-height:1.6;
  }
  .poster-line:nth-child(1){border-left-color:#f0c040}
  .poster-line:nth-child(2){border-left-color:#5b9eff}
  .poster-line:nth-child(3){border-left-color:#ff7eb6}
  .poster-line:nth-child(4){border-left-color:#55ddaa}
  .poster-line:nth-child(5){border-left-color:#00e5ff}
  .poster-line:nth-child(6){border-left-color:#ff5577}
  .poster-footer {
    text-align:center; margin-top:14px; padding-top:12px;
    border-top:1px solid rgba(240,192,64,0.15);
    font-size:11px; color:rgba(160,144,192,0.5); line-height:1.6;
  }
  .poster-footer .pf-brand { font-size:12px; color:rgba(240,192,64,0.5); }
  .poster-qr { text-align:center; margin-top:8px; font-size:10px; color:rgba(160,144,192,0.35); }
  /* 海报按钮 */
  .btn-poster {
    width:100%; padding:13px; border:none; border-radius:14px;
    font-size:15px; font-weight:600; cursor:pointer; transition:all 0.3s;
    background:linear-gradient(135deg,#c89030,#a07020); color:white;
    box-shadow:0 4px 20px rgba(200,144,48,0.3); margin-top:8px;
    -webkit-tap-highlight-color:transparent;
  }
  .btn-poster:hover { transform:translateY(-2px); box-shadow:0 6px 28px rgba(200,144,48,0.5); }
  .btn-poster:active { transform:scale(0.97); }
  .btn-poster:disabled { opacity:0.5; cursor:not-allowed; }
</style>
</head>
<body>

<div class="stars" id="stars"></div>

<div class="container">
  <div class="card">

    <div class="title">
      <div class="icon-row">🔮☯🔮</div>
      <h1>玄不救非 · AI算命大师</h1>
      <div class="sub">赛博玄学 · 输入即算</div>
    </div>

    <form id="fortuneForm" style="margin-top:20px">
      <div class="form-group">
        <label>📛 你的姓名</label>
        <input type="text" id="name" placeholder="请输入姓名或昵称" maxlength="20" autocomplete="off">
      </div>
      <div class="form-group">
        <label>🎂 你的生日</label>
        <input type="text" id="birthday" placeholder="YYYY-MM-DD，如 1995-08-15" maxlength="10" inputmode="numeric">
      </div>
      <div class="form-group">
        <label>💬 当前心情</label>
        <input type="text" id="mood" placeholder="一句话说说现在的心情" maxlength="50">
      </div>
      <button type="submit" class="btn-primary" id="submitBtn">🔮 开 始 算 命</button>
    </form>

    <div class="loading" id="loading">
      <div class="crystal-stage" id="crystalStage">
        <div class="crystal-aura"></div>
        <div class="crystal-ball"></div>
        <div class="rune-ring" id="runeRing"></div>
      </div>
      <div class="rune-text" id="runeText"></div>
      <div class="loading-msg" id="loadingMsg">🔮 正在施法，请稍候<span class="dots"></span></div>
    </div>

    <div class="result" id="result"></div>
    <button class="btn-poster" id="posterBtn" style="display:none">📸 生成海报 · 发朋友圈</button>
    <button class="btn-secondary" id="retryBtn" style="display:none">🔄 再算一次</button>
  </div>

  <!-- 海报渲染区（屏幕外） -->
  <div id="posterWrap"><div class="poster" id="poster"></div></div>

  <div class="footer">☯ 仅供娱乐 · 你才是自己命运的主宰 ☯</div>
</div>

<script>
// ============================================================
// 星星背景
// ============================================================
(function() {
  var s = document.getElementById('stars');
  for (var i = 0; i < 60; i++) {
    var d = document.createElement('div'); d.className = 'star';
    var size = Math.random() * 2.5 + 1;
    d.style.cssText =
      'left:'+Math.random()*100+'%;top:'+Math.random()*100+'%;'+
      'width:'+size+'px;height:'+size+'px;'+
      '--dur:'+(Math.random()*3+2)+'s;--delay:'+(Math.random()*5)+'s;';
    s.appendChild(d);
  }
})();

// ============================================================
// 水晶球符文初始化
// ============================================================
(function() {
  var runes = ['乾','坤','震','巽','坎','离','艮','兑'];
  var ring = document.getElementById('runeRing');
  for (var i = 0; i < 8; i++) {
    var span = document.createElement('span');
    span.className = 'rune-char';
    span.textContent = runes[i];
    var angle = (i * 45 - 90) * Math.PI / 180;
    var r = 45;
    span.style.left = (50 + r * Math.cos(angle)) + '%';
    span.style.top = (50 + r * Math.sin(angle)) + '%';
    ring.appendChild(span);
  }
  // 添加火花粒子
  var stage = document.getElementById('crystalStage');
  for (var j = 0; j < 10; j++) {
    var spark = document.createElement('div');
    spark.className = 'spark';
    spark.style.cssText =
      'left:'+(40+Math.random()*40)+'%;top:'+(35+Math.random()*50)+'%;'+
      '--sx:'+(Math.random()*40-20)+'px;--sy:'+(Math.random()*-30-10)+'px;'+
      'animation-delay:'+(Math.random()*2)+'s;'+
      'animation-duration:'+(1.5+Math.random()*2)+'s';
    stage.appendChild(spark);
  }
})();

// ============================================================
// 模板数据 (与Python版完全一致)
// ============================================================

var STAR_PERSONALITY = {
  "紫微": ["帝王星坐命",["天生自带主角光环，气场两米八！今日决策力MAX，适合主导方向性事务。","帝王之气加持，今天走到哪都是焦点，说话都带混响 👑","今天你就是人群中的紫微星，优柔寡断不存在的好吗","自信是最好的风水，今天做什么都有一种天然的领导力"],4],
  "天机": ["智多星坐命",["脑袋转得比CPU还快，今天适合头脑风暴、搞创意、做方案。","智商在线的一天，复杂问题到你手里迎刃而解 🧠","今天灵感像连了WiFi，各种idea自动下载中……","聪明灵活是你的超能力，今天特别适合解决难题"],4],
  "太阳": ["太阳星坐命",["走到哪亮到哪！今天适合主动出击，展现自己的热情和魅力。","正能量辐射全宇宙，今天你就是行走的小太阳 ☀️","热情是你最强的磁场，今天大胆发光就对了","今天适合当人群中的C位，自信放光芒"],4],
  "武曲": ["武曲星坐命",["刚毅果决，执行力爆表。今天适合处理积压任务、推进项目。","行动力拉满的一天，说干就干不磨叽 💪","财星坐命，今天对事情的判断特别果断靠谱","今天适合用执行力碾压一切拖延症"],4],
  "天同": ["天同星坐命",["福星高照，心态稳如老狗。今天适合享受生活，顺其自然。","佛系但不摆烂，今天用一种轻松的方式把事情做了 🧘","福气值满格，今天凡事都有小幸运加持","不争不抢反而收获最多，今天做自己就好"],4],
  "廉贞": ["廉贞星坐命",["执着又多变，今天创意灵感迸发，但也容易纠结小事。","创意井喷但注意力容易分散，记得抓重点 🎨","今天脑子里全是idea，选一个最好的去执行就好","感性理性反复横跳的一天，跟着直觉走不会错"],3],

// ============================================================
// 核心算法
// ============================================================

function moodCategory(mood) {
  var m = mood.trim().toLowerCase();
  var map = {
    "开心":"开心","高兴":"开心","快乐":"开心","爽":"开心","happy":"开心","好":"开心",
    "积极":"积极","加油":"积极","冲":"积极","努力":"积极",
    "平静":"平静","淡定":"平静","佛系":"平静","随便":"平静",
    "低落":"低落","难过":"低落","伤心":"低落","sad":"低落","emo":"低落",
    "焦虑":"焦虑","紧张":"焦虑","慌":"焦虑","急":"焦虑",
    "烦躁":"烦躁","烦":"烦躁","累":"烦躁","困":"烦躁",
    "好奇":"积极","期待":"积极","迷茫":"低落","无聊":"平静"
  };
  for (var kw in map) {
    if (m.indexOf(kw) !== -1) return map[kw];
  }
  if (mood.trim().length <= 2) return "平静";
  if (/[好棒赞爱喜欢]/.test(m)) return "开心";
  if (/[累困烦糟糕烂]/.test(m)) return "烦躁";
  return "平静";
}

// 简易 hash 函数
function hashStr(s) {
  var h = 0;
  for (var i = 0; i < s.length; i++) {
    h = ((h << 5) - h + s.charCodeAt(i)) | 0;
  }
  return Math.abs(h);
}

// 基于种子的伪随机选择
function pick(arr, seed, idx) {
  return arr[(seed + idx * 131) % arr.length];
}

// 从值（可能是字符串或数组）中挑一条
function pickText(val, seed, fallback) {
  if (Array.isArray(val)) return val[seed % val.length];
  if (typeof val === 'string' || val instanceof String) return val;
  return fallback[seed % fallback.length];
}

function shuffle(arr, seed) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = (seed * (i + 1) * 31) % (i + 1);
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function starsStr(n) {
  var s = "";
  for (var i = 0; i < 5; i++) s += (i < n) ? "★" : "☆";
  return s;
}

// ============================================================
// 命理引擎
// ============================================================

function generateFortune(name, birthday, mood) {
  var seed = hashStr(name + "|" + birthday);
  var mcat = moodCategory(mood);
  var moodSeed = hashStr(mood);

  // 生肖
  var dt = new Date(birthday + "T00:00:00");
  var year = dt.getFullYear();
  var month = dt.getMonth() + 1;
  var day = dt.getDate();
  var zodiac = ["猴","鸡","狗","猪","鼠","牛","虎","兔","龙","蛇","马","羊"];
  var animal = zodiac[year % 12];

  // 宿曜 (day of week based)
  var dayXiuList = ["日曜","月曜","火曜","水曜","木曜","金曜","土曜"];
  var dayXiu = dayXiuList[dt.getDay()];

  // 根据生日选一个"主导星"——不是真的紫微斗数，但能让每天都不同
  var starPool = ["紫微","天机","太阳","武曲","天同","廉贞","天府","太阴","贪狼","巨门","天相","天梁","七杀","破军"];
  // 用生日天数 + 年份混合选择
  var dayOfYear = Math.floor((dt - new Date(year, 0, 0)) / 86400000);
  var starIdx = (dayOfYear * 7 + year * 3 + month * 11 + day * 17) % starPool.length;
  var mainStar = starPool[starIdx];

  var info = STAR_PERSONALITY[mainStar] || ["","命运自成一格，与众不同。",3];
  var yunshiDesc = pickText(info[1], seed + moodSeed, ["命运自成一格，与众不同。"]);

  // 星级 (基于月份+日期混合)
  var ratingBase = info[2];
  var ratingMod = (dayOfYear + hashStr(name) % 31) % 3 - 1; // -1, 0, +1
  var rating = Math.max(2, Math.min(5, ratingBase + ratingMod));
  var stars = starsStr(rating);

  // 事业/财运/桃花——从不同偏移量取星
  var careerStar = starPool[(starIdx + 3) % starPool.length];
  var wealthStar = starPool[(starIdx + 5) % starPool.length];
  var loveStar = starPool[(starIdx + 7) % starPool.length];

  // 心情加持
  var boosts = MOOD_BOOST[mcat] || ["🌟 今天运势不错，保持好心情！","🍀 吉星高照！","✨ 命运在自己手中！"];
  var moodLine = boosts[hashStr(mood + "boost") % boosts.length];

  // 宜/忌 —— 用心情做偏移，不同心情不同结果，同一个人也不会重复
  var shuffledDo = shuffle(DO_ACTIONS, seed + moodSeed);
  var shuffledDont = shuffle(DONT_ACTIONS, seed + moodSeed + 777);
  // 取第3-4个而不是第1-2个，不同心情偏移不同位置
  var moodOffset = moodSeed % 20;
  var doItems = [shuffledDo[moodOffset % shuffledDo.length], shuffledDo[(moodOffset + 7) % shuffledDo.length]];
  var dontItems = [shuffledDont[(moodOffset + 3) % shuffledDont.length], shuffledDont[(moodOffset + 11) % shuffledDont.length]];

  // 综合运势行 —— 心情加持不同的运势描述
  var yunshiMods = {
    "开心": ["运势翻倍！","好运buff叠加中！","锦鲤附体！"],
    "积极": ["冲劲满满！","能量值拉满！","干劲十足！"],
    "平静": ["稳如泰山。","岁月静好。","波澜不惊。"],
    "低落": ["触底反弹中…","乌云会散的。","蹲得越低跳得越高。"],
    "焦虑": ["深呼吸，运势不差。","别急，好事在后头。","稳住就能赢。"],
    "烦躁": ["水逆退散中…","霉运退退退！","冷静下来再看。"]
  };
  var yunshiMod = (yunshiMods[mcat] || ["运势平稳。"])[moodSeed % 3];
  var yunshiLine = "🌟 今日综合运势：" + yunshiDesc + " " + stars + " " + yunshiMod;

  var lines = [
    yunshiLine,
    "💼 事业/学业运：" + pickText(STAR_CAREER[careerStar], seed + moodSeed, GENERAL_CAREER),
    "💕 桃花运：" + pickText(STAR_LOVE[loveStar], seed + moodSeed + 333, GENERAL_LOVE),
    "💰 财运：" + pickText(STAR_WEALTH[wealthStar], seed + moodSeed + 555, GENERAL_WEALTH),
    "✅ 宜：" + doItems.join("，"),
    "❌ 忌：" + dontItems.join("，"),
    "📿 " + moodLine
  ];

  return lines.join("\n");
}

form.addEventListener('submit', function(e) {
  e.preventDefault();
  var name = document.getElementById('name').value.trim();
  var birthday = document.getElementById('birthday').value.trim();
  var mood = document.getElementById('mood').value.trim();

  if (!name || !birthday || !mood) {
    showError("姓名、生日、心情都要填哦～");
    return;
  }
  if (!/^\d{4}-\d{2}-\d{2}$/.test(birthday)) {
    showError("日期格式不对，请用 YYYY-MM-DD，如 1995-08-15");
    return;
  }
  // 验证日期有效性
  var dt = new Date(birthday + "T00:00:00");
  if (isNaN(dt.getTime())) {
    showError("请输入有效的日期");
    return;
  }

  // 每日一签：每天最多算两次
  var today = new Date().toDateString();
  var lastDate = localStorage.getItem('fortune_date');
  var count = parseInt(localStorage.getItem('fortune_count')) || 0;
  if (lastDate === today && count >= 2) {
    showDailyLock();
    return;
  }

  result.className = 'result'; result.innerHTML = '';
  retryBtn.style.display = 'none';
  posterBtn.style.display = 'none';
  loading.classList.add('active');
  submitBtn.disabled = true;

  // 播放施法音效
  // (音效已移除)

  // 符文逐字浮现动画
  var runeText = document.getElementById('runeText');
  var loadingMsg = document.getElementById('loadingMsg');
  var spellPhases = [
    {runes:'乾 坤 震 巽', msg:'🔮 感应天地灵气<span class="dots"></span>'},
    {runes:'坎 离 艮 兑', msg:'✨ 推演八卦命盘<span class="dots"></span>'},
    {runes:'紫 微 斗 数', msg:'🌟 星曜布阵中<span class="dots"></span>'},
    {runes:'天 机 入 命', msg:'☯ 天机即将揭晓<span class="dots"></span>'}
  ];
  var phaseIdx = 0;
  function nextPhase() {
    if (phaseIdx >= spellPhases.length) return;
    var phase = spellPhases[phaseIdx];
    runeText.innerHTML = '';
    var chars = phase.runes.split(' ');
    chars.forEach(function(ch, i) {
      var span = document.createElement('span');
      span.textContent = ch;
      span.style.animationDelay = (i * 0.15) + 's';
      runeText.appendChild(span);
    });
    loadingMsg.innerHTML = phase.msg;
    phaseIdx++;
  }
  nextPhase();
  var phaseTimer = setInterval(function() {
    nextPhase();
    if (phaseIdx >= spellPhases.length) clearInterval(phaseTimer);
  }, 600);

  // 施法延迟 2.5 秒
  setTimeout(function() {
    clearInterval(phaseTimer);
    // playRevealSound(); // 音效已移除
    try {
      var fortune = generateFortune(name, birthday, mood);
      loading.classList.remove('active');
      submitBtn.disabled = false;
      result.className = 'result active';

      var html = '';
      var lines = fortune.trim().split('\n');
      lines.forEach(function(line) {
        var t = line.trim();
        if (t) html += '<div class="result-line">' + escapeHtml(t) + '</div>';
      });
      result.innerHTML = html;
      retryBtn.style.display = 'block';
      posterBtn.style.display = 'block';
      // 记录今日卦象次数
      localStorage.setItem('fortune_date', today);
      var curCount = parseInt(localStorage.getItem('fortune_count')) || 0;
      localStorage.setItem('fortune_count', curCount + 1);
      // 缓存最近一次结果，超过次数后可回看
      localStorage.setItem('fortune_last_html', html);
      localStorage.setItem('fortune_last_name', name);
      localStorage.setItem('fortune_last_birthday', birthday);
      localStorage.setItem('fortune_last_mood', mood);
      localStorage.setItem('fortune_last_lines', JSON.stringify(lines));
      // 缓存海报数据
      posterBtn._data = {name:name, birthday:birthday, mood:mood, lines:lines};
    } catch (err) {
      loading.classList.remove('active');
      submitBtn.disabled = false;
      showError("算命出错，请重试～");
    }
  }, 2500);
});

posterBtn.addEventListener('click', function() {
  var data = posterBtn._data;
  if (!data) return;

  posterBtn.disabled = true;
  posterBtn.textContent = '⏳ 正在生成海报...';

  var poster = document.getElementById('poster');
  var wrap = document.getElementById('posterWrap');

  // 构建海报 HTML
  var dt = new Date(data.birthday + 'T00:00:00');
  var zodiac = ['猴','鸡','狗','猪','鼠','牛','虎','兔','龙','蛇','马','羊'];
  var animal = zodiac[dt.getFullYear() % 12];
  var today = new Date();
  var dateStr = today.getFullYear() + '.' + (today.getMonth()+1) + '.' + today.getDate();

  // 生成海报背景星星
  var starsHtml = '';
  for (var i = 0; i < 50; i++) {
    var sx = Math.random()*100, sy = Math.random()*100;
    var ss = Math.random()*2+0.5;
    starsHtml += '<div class="poster-star" style="left:'+sx+'%;top:'+sy+'%;width:'+ss+'px;height:'+ss+'px;--pdur:'+(Math.random()*3+2)+'s;--pdelay:'+(Math.random()*4)+'s;"></div>';
  }

  var fortuneHtml = '';
  data.lines.forEach(function(line) {
    var t = line.trim();
    if (t) fortuneHtml += '<div class="poster-line">' + escapeHtml(t) + '</div>';
  });

  poster.innerHTML =
    '<div class="poster-stars">'+starsHtml+'</div>'+
    '<div class="poster-border"></div>'+
    '<div class="poster-corner pc-tl"></div>'+
    '<div class="poster-corner pc-tr"></div>'+
    '<div class="poster-corner pc-bl"></div>'+
    '<div class="poster-corner pc-br"></div>'+
    '<div class="poster-inner">'+
      '<div class="poster-header">'+
        '<div class="ph-icon">🔮☯🔮</div>'+
        '<div class="ph-title">玄不救非 · AI算命大师</div>'+
        '<div class="ph-divider"></div>'+
      '</div>'+
      '<div class="poster-meta">'+
        '<div>📛 <span class="ph-name">'+escapeHtml(data.name)+'</span></div>'+
        '<div>🎂 '+escapeHtml(data.birthday)+' · 属'+animal+'</div>'+
        '<div>📅 占卜日期：'+dateStr+'</div>'+
      '</div>'+
      '<div class="poster-fortune">'+fortuneHtml+'</div>'+
      '<div class="poster-footer">'+
        '<div class="pf-brand">🔮 赛博玄学，仅供娱乐</div>'+
        '<div>☯ 你才是自己命运的主宰 ☯</div>'+
      '</div>'+
    '</div>';

  // 让海报进入可见区域以便截图
  wrap.style.left = '0';
  wrap.style.top = '0';

  // 用 html2canvas 截图
  setTimeout(function() {
    if (typeof html2canvas === 'undefined') {
      wrap.style.left = '-9999px';
      posterBtn.disabled = false;
      posterBtn.textContent = '📸 生成海报 · 发朋友圈';
      alert('海报库加载失败，请检查网络后刷新页面重试。');
      return;
    }
    html2canvas(poster, {
      backgroundColor: null,
      scale: 2,
      useCORS: true,
      allowTaint: true
    }).then(function(canvas) {
      wrap.style.left = '-9999px';
      // 触发下载
      var link = document.createElement('a');
      link.download = '赛博算命_' + data.name + '_' + dateStr.replace(/\./g,'') + '.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
      posterBtn.disabled = false;
      posterBtn.textContent = '📸 生成海报 · 发朋友圈';
    }).catch(function(err) {
      wrap.style.left = '-9999px';
      posterBtn.disabled = false;
      posterBtn.textContent = '📸 生成海报 · 发朋友圈';
      alert('海报生成失败，请重试～');
    });
  }, 300);
});
</script>
</body>
</html>
