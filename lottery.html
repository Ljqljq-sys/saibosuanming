<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>赛博抽签 · 玄不救非</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
  :root {
    --purple: #9d4edd;
    --pink: #e040fb;
    --cyan: #00f5ff;
    --card-bg: rgba(15, 5, 30, 0.82);
    --gold: #f0c040;
    --red: #ff5577;
    --green: #55ddaa;
    --orange: #ff8844;
  }
  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: radial-gradient(ellipse at 50% 60%, #14082a 0%, #0a0015 45%, #050510 100%);
    color: #e0d0f0;
    font-family: "Microsoft YaHei","PingFang SC","Helvetica Neue",sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    overflow-x:hidden; position:relative;
    padding: 80px 20px 40px;
  }

  /* ===== Canvas 背景 ===== */
  #gridCanvas, #rainCanvas {
    position:fixed; top:0; left:0; width:100%; height:100%; z-index:0; pointer-events:none;
  }
  #gridCanvas  { z-index:0; }
  #rainCanvas { z-index:1; }

  /* ===== 光晕 ===== */
  .glow-orb {
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    width:min(500px,80vw); height:min(500px,80vw);
    background:radial-gradient(circle, rgba(157,78,221,0.14) 0%, rgba(0,245,255,0.04) 30%, transparent 70%);
    border-radius:50%; filter:blur(60px); z-index:0; pointer-events:none;
    animation:orbPulse 4s ease-in-out infinite;
  }
  @keyframes orbPulse {
    0%,100% { transform:translate(-50%,-50%) scale(0.9); opacity:0.5; }
    50%     { transform:translate(-50%,-50%) scale(1.3); opacity:1; }
  }

  /* ===== 顶栏 ===== */
  .top-bar {
    position:fixed; top:0; left:0; right:0; z-index:10;
    background:rgba(15,5,30,0.85); backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    border-bottom:1px solid rgba(157,78,221,0.2);
    padding:10px 20px; display:flex; align-items:center; justify-content:space-between;
    font-size:13px;
  }
  .top-bar .counter { color:var(--cyan); font-family:'Orbitron',sans-serif; letter-spacing:1px; }
  .top-bar .date   { color:rgba(160,144,192,0.5); font-size:11px; }
  .back-btn {
    font-family:'Orbitron',sans-serif; font-size:11px; letter-spacing:2px;
    color:rgba(200,180,220,0.7); text-decoration:none;
    padding:6px 16px; border:1px solid rgba(157,78,221,0.3);
    border-radius:20px; transition:all 0.3s;
  }
  .back-btn:hover { color:#fff; border-color:var(--purple); box-shadow:0 0 12px rgba(157,78,221,0.3); }

  /* ===== 主容器 ===== */
  .main {
    position:relative; z-index:3; text-align:center;
    width:100%; max-width:660px;
  }

  .title {
    font-family:'Orbitron','Microsoft YaHei',sans-serif;
    font-size:clamp(22px,4vw,34px); font-weight:900; letter-spacing:4px;
    color:#fff;
    text-shadow:0 0 10px var(--purple),0 0 30px var(--purple),0 0 60px rgba(157,78,221,0.5);
    margin-bottom:4px;
    animation:titleGlow 2s ease-in-out infinite alternate;
  }
  @keyframes titleGlow {
    from { text-shadow:0 0 10px var(--purple),0 0 30px var(--purple),0 0 60px rgba(157,78,221,0.5); }
    to   { text-shadow:0 0 20px var(--purple),0 0 50px var(--pink),0 0 80px rgba(224,64,251,0.6); }
  }
  .subtitle {
    font-family:'Orbitron',sans-serif;
    font-size:clamp(10px,1.6vw,12px); letter-spacing:5px;
    color:rgba(160,144,192,0.5); margin-bottom:36px;
  }

  /* ===== 卡片网格 ===== */
  .cards {
    display:grid; grid-template-columns:repeat(3, 1fr); gap:18px;
  }

  .card {
    background:var(--card-bg);
    border:1px solid rgba(157,78,221,0.25);
    border-radius:18px; padding:28px 16px 22px;
    cursor:pointer; position:relative; overflow:hidden;
    transition:transform 0.35s cubic-bezier(.34,1.56,.64,1), box-shadow 0.35s, border-color 0.35s, opacity 0.35s, filter 0.35s;
    opacity:0; transform:translateY(30px);
    animation:fadeInUp 0.6s ease forwards;
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    user-select:none; -webkit-tap-highlight-color:transparent;
  }
  .card:nth-child(1) { animation-delay:0.00s; }
  .card:nth-child(2) { animation-delay:0.07s; }
  .card:nth-child(3) { animation-delay:0.14s; }
  .card:nth-child(4) { animation-delay:0.21s; }
  .card:nth-child(5) { animation-delay:0.28s; }
  .card:nth-child(6) { animation-delay:0.35s; }
  @keyframes fadeInUp {
    to { opacity:1; transform:translateY(0); }
  }

  .card::before {
    content:''; position:absolute; top:0; left:0; width:100%; height:100%;
    background:radial-gradient(ellipse at 50% 0%, rgba(157,78,221,0.10) 0%, transparent 70%);
    opacity:0; transition:opacity 0.35s;
  }
  .card:hover { transform:translateY(-8px); box-shadow:0 0 28px rgba(157,78,221,0.3),0 0 50px rgba(224,64,251,0.12),0 8px 30px rgba(0,0,0,0.5); border-color:rgba(157,78,221,0.6); }
  .card:hover::before { opacity:1; }
  .card:active { transform:scale(0.95) translateY(-4px); transition:transform 0.1s; }

  /* 锁定状态 */
  .card.locked {
    opacity:0.5; cursor:default; filter:grayscale(0.35);
  }
  .card.locked:hover { transform:none; box-shadow:none; border-color:rgba(157,78,221,0.25); }
  .card.locked:hover::before { opacity:0; }
  .card.locked::after {
    content:'🔒'; position:absolute; top:10px; right:14px; font-size:14px;
    opacity:0.7; z-index:2;
  }
  /* 已抽标记 */
  .card.done::after {
    content:'✅'; position:absolute; top:10px; right:14px; font-size:14px;
    opacity:0.8; z-index:2;
  }

  .card-icon {
    font-size:clamp(32px,5.5vw,46px); margin-bottom:8px;
    position:relative; z-index:1; display:block;
    transition:transform 0.35s;
  }
  .card:hover .card-icon { transform:scale(1.1); }
  .card.locked:hover .card-icon { transform:none; }

  .card-label {
    font-family:'Orbitron','Microsoft YaHei',sans-serif;
    font-size:clamp(13px,2vw,16px); font-weight:700; letter-spacing:2px;
    position:relative; z-index:1;
  }
  .card-desc {
    font-size:11px; color:#706090; margin-top:4px;
    position:relative; z-index:1;
  }

  /* ===== 增强摇晃动画 (rotate ±15°, 频率由快到慢 1.5s) ===== */
  .card.shaking {
    animation:cardShakeEnhanced 1.5s ease-out !important;
  }
  @keyframes cardShakeEnhanced {
    0%   { transform:rotate(0deg); }
    4%   { transform:rotate(15deg); }
    8%   { transform:rotate(-13deg); }
    12%  { transform:rotate(11deg); }
    16%  { transform:rotate(-9deg); }
    20%  { transform:rotate(7deg); }
    25%  { transform:rotate(-5.5deg); }
    30%  { transform:rotate(4deg); }
    36%  { transform:rotate(-3deg); }
    42%  { transform:rotate(2deg); }
    48%  { transform:rotate(-1.2deg); }
    55%  { transform:rotate(0.8deg); }
    62%  { transform:rotate(-0.4deg); }
    70%  { transform:rotate(0.2deg); }
    80%,100% { transform:rotate(0deg); }
  }

  /* ===== 漂浮 Emoji 粒子 ===== */
  .emoji-particle {
    position:fixed; pointer-events:none; z-index:44;
    font-size:22px; animation:emojiFloat 1.2s ease-out forwards;
  }
  @keyframes emojiFloat {
    0%   { opacity:1; transform:translateY(0) translateX(0) scale(0.5); }
    30%  { opacity:1; transform:translateY(-40px) translateX(var(--ex)) scale(1.2); }
    100% { opacity:0; transform:translateY(-120px) translateX(var(--ex)) scale(0.3); }
  }

  /* ===== 飞签元素 (CSS绘制) ===== */
  .flying-sign {
    position:fixed; z-index:45; pointer-events:none;
    display:flex; flex-direction:column; align-items:center;
  }
  .sign-stick {
    width:14px; height:90px;
    background:linear-gradient(180deg, #ffe680 0%, #e6a800 20%, #ffd700 50%, #b8780a 100%);
    border-radius:3px 3px 2px 2px;
    box-shadow:0 0 24px rgba(240,192,64,0.7),0 0 50px rgba(240,192,64,0.35),inset 0 1px 0 rgba(255,255,255,0.4);
    position:relative;
    overflow:hidden;
  }
  .sign-stick::before {
    content:''; position:absolute; top:4px; left:2px; right:2px; bottom:4px;
    border:1px solid rgba(255,255,255,0.25); border-radius:2px;
  }
  .sign-stick::after {
    content:'签';
    position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
    font-size:16px; color:#5a3800; font-weight:bold;
    font-family:'KaiTi','STKaiti','SimSun',serif;
    text-shadow:0 0 4px rgba(255,215,0,0.5);
  }
  .sign-tassel {
    width:5px; height:26px;
    background:linear-gradient(180deg, #ff3333 0%, #cc0000 100%);
    border-radius:0 0 3px 3px; margin-top:-2px;
    box-shadow:0 0 10px rgba(255,50,50,0.5);
    position:relative;
  }
  .sign-tassel::after {
    content:''; position:absolute; bottom:-8px; left:-4px; width:13px; height:10px;
    background:radial-gradient(ellipse, rgba(255,60,60,0.7), transparent 70%);
    border-radius:50%;
  }
  /* 飞签各阶段 */
  .flying-sign.fly-up {
    animation:signFlyUp 0.8s cubic-bezier(.22,.61,.36,1) forwards;
  }
  @keyframes signFlyUp {
    0%   { transform:translate(0, 0) rotate(0deg); opacity:0.7; }
    30%  { transform:translate(var(--fx), var(--fy)) rotate(200deg); opacity:1; }
    60%  { transform:translate(calc(var(--fx)*0.6), calc(var(--fy)*0.65)) rotate(500deg); opacity:1; }
    100% { transform:translate(0, 0) rotate(720deg); opacity:1; }
  }
  .flying-sign.hovering {
    animation:signHover 0.5s ease-in-out infinite alternate;
  }
  @keyframes signHover {
    from { transform:translate(0, 0); }
    to   { transform:translate(0, -8px); }
  }

  /* ===== 签文展开 (卷轴 scaleX) ===== */
  .flying-sign.reveal .sign-stick {
    animation:scrollUnfold 0.5s ease-out forwards;
  }
  @keyframes scrollUnfold {
    0%   { transform:scaleX(0); }
    70%  { transform:scaleX(3.2); }
    85%  { transform:scaleX(2.8); }
    100% { transform:scaleX(3); }
  }
  .flying-sign.pop-settle .sign-stick {
    animation:signPopSettle 0.4s ease-out;
  }
  @keyframes signPopSettle {
    0%   { transform:scale(3.0); }
    40%  { transform:scale(3.15); }
    70%  { transform:scale(2.95); }
    100% { transform:scale(3.0); }
  }
  /* 签文浮现文本 */
  .sign-text-reveal {
    position:fixed; z-index:46; pointer-events:none;
    font-family:'KaiTi','STKaiti','SimSun',serif;
    font-size:15px; color:#d0c8e4; text-align:center;
    max-width:260px; line-height:1.8;
    text-shadow:0 0 6px rgba(240,192,64,0.4);
    animation:textGlowFlicker 2s ease-in-out infinite;
  }
  @keyframes textGlowFlicker {
    0%,100% { text-shadow:0 0 6px rgba(240,192,64,0.4),0 0 2px rgba(240,192,64,0.2); }
    25%     { text-shadow:0 0 10px rgba(240,192,64,0.7),0 0 4px rgba(240,192,64,0.4); }
    50%     { text-shadow:0 0 4px rgba(240,192,64,0.3),0 0 1px rgba(240,192,64,0.1); }
    75%     { text-shadow:0 0 14px rgba(240,192,64,0.8),0 0 6px rgba(240,192,64,0.5); }
  }

  /* ===== 等级氛围粒子 ===== */
  .atmo-particle {
    position:fixed; pointer-events:none; z-index:43; border-radius:50%;
  }
  /* 大吉/吉: 金色粒子飘落 */
  .atmo-particle.gold-fall {
    animation:goldFall var(--fall-dur) linear forwards;
  }
  @keyframes goldFall {
    0%   { opacity:1; transform:translateY(-20px) translateX(0) scale(1); }
    70%  { opacity:0.6; }
    100% { opacity:0; transform:translateY(105vh) translateX(var(--drift)) scale(0.3); }
  }
  /* 中吉/末吉: 柔光缓缓上浮 */
  .atmo-particle.soft-rise {
    animation:softRise var(--rise-dur) ease-out forwards;
  }
  @keyframes softRise {
    0%   { opacity:0; transform:translateY(0) scale(0.3); }
    30%  { opacity:0.7; }
    100% { opacity:0; transform:translateY(-300px) translateX(var(--drift)) scale(1.5); }
  }
  /* 凶/大凶: 裂纹碎片 */
  .crack-shard {
    position:fixed; pointer-events:none; z-index:43;
    background:rgba(180,30,30,0.5); border-radius:1px;
    animation:crackIn var(--crack-dur) ease-out forwards;
  }
  @keyframes crackIn {
    0%   { opacity:0; transform:rotate(var(--cr)) scale(0); }
    30%  { opacity:0.9; }
    100% { opacity:0; transform:rotate(var(--cr)) scale(1.2); }
  }
  /* 凶/大凶: 暗红氛围 */
  .doom-overlay {
    position:fixed; inset:0; z-index:42; pointer-events:none;
    background:radial-gradient(ellipse at center, rgba(180,20,20,0.15) 0%, rgba(80,0,0,0.08) 50%, transparent 70%);
    animation:doomPulse 0.8s ease-out forwards;
  }
  @keyframes doomPulse {
    0%   { opacity:0; }
    50%  { opacity:1; }
    100% { opacity:0; }
  }

  /* ===== 隐藏签增强: 荧光绿+紫色交替 ===== */
  .hidden-overlay.active .hidden-text.glitch-flash {
    animation:glitchFlash 0.15s ease-in-out 3;
  }
  @keyframes glitchFlash {
    0%,100% { color:#00ff00; text-shadow:0 0 10px #00ff00,0 0 30px #00ff00,0 0 60px rgba(0,255,0,0.5); }
    50%     { color:#bf00ff; text-shadow:0 0 10px #bf00ff,0 0 30px #bf00ff,0 0 60px rgba(191,0,255,0.5); }
  }

  /* ===== 结果弹窗 ===== */
  .modal-overlay {
    position:fixed; inset:0; z-index:50; background:rgba(0,0,0,0.78);
    backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none;
    transition:opacity 0.3s;
  }
  .modal-overlay.active { opacity:1; pointer-events:auto; }

  .modal {
    background:var(--card-bg);
    border:1px solid rgba(157,78,221,0.35);
    border-radius:20px; padding:32px 24px 24px;
    max-width:440px; width:90%; max-height:85vh; overflow-y:auto;
    position:relative;
    transform:translateY(30px);
    transition:transform 0.35s cubic-bezier(.34,1.56,.64,1);
  }
  .modal-overlay.active .modal { transform:translateY(0); }

  /* 等级边框颜色 */
  .modal.level-大吉 { border-color:rgba(240,192,64,0.7); box-shadow:0 0 30px rgba(240,192,64,0.2); }
  .modal.level-吉   { border-color:rgba(0,245,255,0.6); box-shadow:0 0 20px rgba(0,245,255,0.15); }
  .modal.level-中吉 { border-color:rgba(85,221,170,0.6); box-shadow:0 0 20px rgba(85,221,170,0.12); }
  .modal.level-末吉 { border-color:rgba(221,170,85,0.5); }
  .modal.level-凶   { border-color:rgba(255,136,68,0.6); box-shadow:0 0 20px rgba(255,136,68,0.12); }
  .modal.level-大凶 { border-color:rgba(255,85,119,0.7); box-shadow:0 0 30px rgba(255,85,119,0.2); }
  .modal.level-？？？ { border-color:#00ff00; box-shadow:0 0 40px rgba(0,255,0,0.3); }

  .modal-header {
    text-align:center; margin-bottom:20px;
  }
  .modal-level {
    font-family:'Orbitron',sans-serif; font-size:28px; font-weight:900; letter-spacing:3px;
    margin-bottom:4px;
  }
  .modal-type {
    font-size:12px; color:#706090; letter-spacing:2px;
  }
  .modal-divider {
    width:60px; height:1px; margin:16px auto;
    background:linear-gradient(90deg, transparent, rgba(157,78,221,0.5), transparent);
  }
  .modal-text {
    font-size:15px; line-height:1.8; text-align:center;
    color:#d0c8e4; margin-bottom:20px;
    min-height:50px;
  }
  .modal-lucky-row {
    display:flex; gap:12px; justify-content:center; margin-bottom:20px;
  }
  .modal-lucky-item {
    flex:1; max-width:140px; background:rgba(157,78,221,0.08);
    border-radius:12px; padding:12px; text-align:center;
    border:1px solid rgba(157,78,221,0.15);
  }
  .modal-lucky-item .swatch {
    display:inline-block; width:22px; height:22px; border-radius:50%;
    vertical-align:middle; margin-right:6px;
  }
  .modal-lucky-item .lucky-label { font-size:10px; color:#706090; letter-spacing:1px; margin-bottom:4px; }
  .modal-lucky-item .lucky-val  { font-size:13px; color:#e0d0f0; font-family:'Orbitron',sans-serif; }

  .modal-advice {
    display:flex; gap:12px; margin-bottom:20px;
  }
  .modal-do, .modal-dont {
    flex:1; padding:12px; border-radius:12px; font-size:12px; line-height:1.6;
  }
  .modal-do   { background:rgba(85,221,170,0.08); border:1px solid rgba(85,221,170,0.2); color:#a0e8cc; }
  .modal-dont { background:rgba(255,85,119,0.08); border:1px solid rgba(255,85,119,0.2); color:#f0a0b0; }

  .modal-btns {
    display:flex; gap:10px; justify-content:center; flex-wrap:wrap;
  }
  .btn {
    font-family:'Orbitron','Microsoft YaHei',sans-serif; font-size:12px; letter-spacing:2px;
    padding:10px 20px; border-radius:25px; cursor:pointer; border:none;
    transition:all 0.3s; font-weight:700;
  }
  .btn-close {
    background:rgba(255,255,255,0.06); color:rgba(200,180,220,0.6);
    border:1px solid rgba(157,78,221,0.2);
  }
  .btn-close:hover { background:rgba(255,255,255,0.1); color:#e0d0f0; }
  .btn-poster {
    background:linear-gradient(135deg, rgba(157,78,221,0.3), rgba(224,64,251,0.2));
    color:#e0d0f0; border:1px solid rgba(224,64,251,0.3);
  }
  .btn-poster:hover { box-shadow:0 0 20px rgba(157,78,221,0.35); transform:translateY(-2px); }
  .btn-poster:active { transform:scale(0.95); }
  .btn-poster:disabled { opacity:0.4; cursor:not-allowed; transform:none; }

  /* ===== 隐藏签覆盖层 ===== */
  .hidden-overlay {
    position:fixed; inset:0; z-index:100; background:#000;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity 0.2s;
  }
  .hidden-overlay.active { opacity:1; pointer-events:auto; }
  #hiddenSignCanvas {
    position:absolute; top:0; left:0; width:100%; height:100%;
  }
  .hidden-text {
    position:relative; z-index:2;
    font-family:'Courier New',monospace; font-size:clamp(14px,2.5vw,18px);
    color:#00ff00; text-align:center; line-height:2;
    text-shadow:0 0 10px #00ff00,0 0 30px #00ff00,0 0 60px rgba(0,255,0,0.5);
    padding:20px; max-width:500px; white-space:pre-wrap;
    min-height:80px;
  }
  .hidden-close {
    position:relative; z-index:2; margin-top:30px;
    font-family:'Courier New',monospace; font-size:14px; letter-spacing:3px;
    color:#00ff00; background:transparent; border:1px solid #00ff00;
    padding:10px 30px; border-radius:25px; cursor:pointer;
    opacity:0; transition:opacity 0.6s;
    text-shadow:0 0 8px #00ff00;
  }
  .hidden-close.show { opacity:1; }
  .hidden-close:hover { background:rgba(0,255,0,0.1); box-shadow:0 0 20px rgba(0,255,0,0.3); }

  /* ===== Toast ===== */
  .toast {
    position:fixed; bottom:40px; left:50%; transform:translateX(-50%);
    background:rgba(30,10,50,0.95); color:#e0d0f0;
    padding:12px 24px; border-radius:30px; font-size:14px;
    border:1px solid rgba(224,64,251,0.4);
    box-shadow:0 0 20px rgba(224,64,251,0.2);
    z-index:999; opacity:0; pointer-events:none;
    transition:opacity 0.4s, transform 0.4s;
    transform:translateX(-50%) translateY(20px);
  }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  /* ===== 海报渲染区 (离屏) ===== */
  #posterWrap {
    position:fixed; left:-9999px; top:0; z-index:-1;
  }
  .poster {
    width:420px; background:linear-gradient(160deg, #0d0020 0%, #12062a 30%, #0a0418 100%);
    padding:28px 24px; position:relative; overflow:hidden;
  }
  .poster-border {

// mulberry32 PRNG — 确定性伪随机数生成器
// 算法: Mulberry32, https://gist.github.com/tommyettinger/46a874533244883189143505d203312c
// 步骤: 状态 += 0x6D2B79F5 → 乘法混合 → 异或移位 → 归一化到 [0,1)
function createRNG(seed) {
  var s = seed | 0;
  return function() {
    s = (s + 0x6D2B79F5) | 0;
    var t = Math.imul(s ^ (s >>> 15), s | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };

function shuffle(arr, seed) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = (seed * (i + 1) * 31) % (i + 1);
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;

  return a;
}

function hslToHex(h, s, l) {
  s /= 100; l /= 100;
  var c = (1 - Math.abs(2 * l - 1)) * s;
  var x = c * (1 - Math.abs(((h / 60) % 2) - 1));
  var m = l - c / 2;
  var r, g, b;
  if (h < 60) { r = c; g = x; b = 0; }
  else if (h < 120) { r = x; g = c; b = 0; }
  else if (h < 180) { r = 0; g = c; b = x; }
  else if (h < 240) { r = 0; g = x; b = c; }
  else if (h < 300) { r = x; g = 0; b = c; }
  else { r = c; g = 0; b = x; }
  var toHex = function(v) {
    var hx = Math.round((v + m) * 255).toString(16);
    return hx.length === 1 ? '0' + hx : hx;
  };
  return '#' + toHex(r) + toHex(g) + toHex(b);

function getTodayKey() {

  return d.getFullYear() + '-' +

    String(d.getDate()).padStart(2, '0');

function storageKey(type) {
  return 'lottery_' + type + '_' + getTodayKey();
}

function isLocked(type) {
  return localStorage.getItem(storageKey(type)) !== null;

  var raw = localStorage.getItem(storageKey(type));
  if (!raw) return null;
  try { return JSON.parse(raw); }
  catch(e) { return null; }
}

function weightedLevel(rng) {
  var roll = rng() * 100;
  for (var i = 0; i < WEIGHT_CUMULATIVE.length; i++) {
    if (roll < WEIGHT_CUMULATIVE[i]) return LEVEL_WEIGHTS[i];
  }
  return LEVEL_WEIGHTS[LEVEL_WEIGHTS.length - 1];
}

var HISTORY_KEY = 'lottery_sign_history';
var MAX_HISTORY = 200;
var RECENT_CHECK = 30;   // 检查最近30条
var MAX_RETRY = 5;       // 最多重试5次

// 读取历史
function getHistory() {
  try {
    var raw = localStorage.getItem(HISTORY_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch(e) { return []; }
}

// 追加历史 (保持最多 MAX_HISTORY 条)
function addHistory(signId, type, level, text) {
  var history = getHistory();
  history.push({
    id: signId,
    type: type,
    level: level,
    text: text,
    ts: Date.now()
  });
  if (history.length > MAX_HISTORY) {
    history = history.slice(history.length - MAX_HISTORY);
  }
  try { localStorage.setItem(HISTORY_KEY, JSON.stringify(history)); }
  catch(e) { /* quota exceeded, silently skip */ }
}

// 检查签文ID是否在最近 N 条中出现过
function isRecentDuplicate(signId, type) {
  var history = getHistory();
  var recent = history.slice(-RECENT_CHECK);
  for (var i = 0; i < recent.length; i++) {
    if (recent[i].id === signId && recent[i].type === type) return true;
  }
  return false;
}

// 带防重复的签文选择 (最多重试 MAX_RETRY 次)
function pickWithDedup(entries, rng, type, level) {
  // 如果条目太少，直接随机
  if (entries.length <= RECENT_CHECK) {
    return { text: entries[Math.floor(rng() * entries.length)], idx: Math.floor(rng() * entries.length) };
  }
  var idx, text, signId;
  for (var retry = 0; retry < MAX_RETRY; retry++) {
    idx = Math.floor(rng() * entries.length);
    text = entries[idx];
    signId = type + '_' + level + '_' + idx;
    if (!isRecentDuplicate(signId, type)) {
      return { text: text, idx: idx, signId: signId };
    }
    // 重复了，用 rng 再跳一次
    rng(); // 消耗一个随机数以改变下一次 idx
  }
  // 5 次都重复 → 接受最后一次
  idx = Math.floor(rng() * entries.length);
  text = entries[idx];
  signId = type + '_' + level + '_' + idx;
  return { text: text, idx: idx, signId: signId };
}

function generateResult(type, clickX, clickY) {
  var todayKey = getTodayKey();

  // 随机签：先确定子类型

  if (type === 'random') {
    var subSeed = hashStr(todayKey + '_' + type + '_sub_v2' + BROWSER_FINGERPRINT + pageLoadTs);
    var subRng = createRNG(subSeed);
    effectiveType = LOTTERY_TYPES[Math.floor(subRng() * LOTTERY_TYPES.length)];
  }

  // ===== 混合种子 (核心改进) =====
  // 组成: 日期 + 签筒名 + 浏览器指纹 + 页面加载时间戳 + 鼠标坐标
  // 确保不同用户、不同时刻、不同点击位置得到不同结果
  var clickXpart = (clickX !== undefined && clickY !== undefined)
    ? '_cx' + Math.round(clickX) + '_cy' + Math.round(clickY)
    : '_noclick';
  var seedInput = todayKey + '_' + effectiveType + '_v2'
    + '_fp' + BROWSER_FINGERPRINT
    + '_ts' + pageLoadTs
    + clickXpart;
  var seed = hashStr(seedInput);
  var rng = createRNG(seed);

  // 获取对应数据库
  var dbMap = {
    wealth: FORTUNE_WEALTH, love: FORTUNE_LOVE, study: FORTUNE_STUDY,
    career: FORTUNE_CAREER, general: FORTUNE_GENERAL, random: FORTUNE_GENERAL
  };
  var db = dbMap[effectiveType] || FORTUNE_GENERAL;

  // 隐藏签检测 (0.05%)
  var hiddenRoll = rng();
  var isHidden = hiddenRoll < 0.0005;

  var result;
  if (isHidden) {
    result = {
      type: type,
      effectiveType: effectiveType,
      level: '？？？',
      levelColor: '#00ff00',
      levelEmoji: '👽',
      text: HIDDEN_SIGNS[type] || HIDDEN_SIGNS['random'],
      do: ['保持怀疑','检查系统日志'],
      dont: ['相信一切','关闭防火墙'],

      luckyNumberComment: 'Error 404: Meaning Not Found',
      luckyDirection: '第四维度',
      isHidden: true,
      signId: type + '_hidden',
      date: todayKey,
      timestamp: Date.now()
    };
  } else {
    // 等级 (加权随机)
    var levelInfo = weightedLevel(rng);

    // 签文 (带防重复)
    var entries = db[levelInfo.level];
    var picked = pickWithDedup(entries, rng, effectiveType, levelInfo.level);
    var text = picked.text;
    var signId = picked.signId;

    // 幸运属性 (基于种子的额外随机值)
    var hue = Math.floor(rng() * 360);
    var luckyColor = hslToHex(hue, 65 + (seed % 20), 50 + (Math.floor(rng() * 15)));
    var luckyColorName = getColorName(hue);
    var luckyNumber = Math.floor(rng() * 99) + 1;
    var luckyNumberComment = getNumComment(luckyNumber);
    var luckyDirection = DIRECTIONS[Math.floor(rng() * DIRECTIONS.length)];

    // 宜忌
    var shuffledDo = shuffle(DO_ACTIONS, seed + 333);
    var shuffledDont = shuffle(DONT_ACTIONS, seed + 777);
    var doItems = [shuffledDo[Math.floor(rng() * shuffledDo.length)], shuffledDo[(Math.floor(rng() * shuffledDo.length) + 7) % shuffledDo.length]];
    var dontItems = [shuffledDont[Math.floor(rng() * shuffledDont.length)], shuffledDont[(Math.floor(rng() * shuffledDont.length) + 5) % shuffledDont.length]];
    // 避免宜忌重叠
    if (dontItems[0] === doItems[0]) dontItems[0] = shuffledDont[(Math.floor(rng() * shuffledDont.length) + 13) % shuffledDont.length];
    if (dontItems[1] === doItems[1]) dontItems[1] = shuffledDont[(Math.floor(rng() * shuffledDont.length) + 17) % shuffledDont.length];

    result = {
      type: type,
      effectiveType: effectiveType,
      level: levelInfo.level,
      levelColor: levelInfo.color,
      levelEmoji: levelInfo.emoji,
      text: text,
      signId: signId,
      do: doItems,
      dont: dontItems,
      luckyColor: luckyColor,
      luckyColorName: luckyColorName,
      luckyNumber: luckyNumber,
      luckyNumberComment: luckyNumberComment,
      luckyDirection: luckyDirection,
      isHidden: false,
      date: todayKey,
      timestamp: Date.now()
    };
  }

  // 追加到历史
  addHistory(result.signId, type, result.level, result.text);

  return result;
}

function saveScoreHistory(type, result) {
  var todayKey = getTodayKey();
  var score = SCORE_MAP[result.level] !== undefined ? SCORE_MAP[result.level] : 2.5;
  var raw = localStorage.getItem(SCORE_HISTORY_KEY);
  var history = raw ? JSON.parse(raw) : [];
  // 查找今天是否已有记录
  var found = null;
  for (var i = 0; i < history.length; i++) {
    if (history[i].date === todayKey) { found = history[i]; break; }
  }
  if (found) {
    // 同天多签：加权平均
    found.score = (found.score * found.count + score) / (found.count + 1);
    found.count += 1;
  } else {
    history.push({ date: todayKey, score: score, count: 1 });
  }
  // 最多 30 天
  if (history.length > MAX_HISTORY_DAYS) history = history.slice(-MAX_HISTORY_DAYS);
  try { localStorage.setItem(SCORE_HISTORY_KEY, JSON.stringify(history)); } catch(e) {}
}

function getChartData() {
  var raw = localStorage.getItem(SCORE_HISTORY_KEY);
  var history = raw ? JSON.parse(raw) : [];
  // 生成最近7天数据
  var days = [];
  for (var i = 6; i >= 0; i--) {
    var d = new Date();
    d.setDate(d.getDate() - i);
    var dateKey = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    var label = String(d.getMonth() + 1).padStart(2, '0') + '/' + String(d.getDate()).padStart(2, '0');
    // 查找该日是否有记录
    var entry = null;
    for (var j = 0; j < history.length; j++) {
      if (history[j].date === dateKey) { entry = history[j]; break; }
    }
    days.push({
      date: dateKey,
      label: label,
      score: entry ? entry.score : null,
      count: entry ? entry.count : 0
    });
  }
  return days;
}

function drawChart(canvas, data) {
  var dpr = window.devicePixelRatio || 1;
  var W = 600, H = 320;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  canvas.style.width = '100%';
  canvas.style.height = 'auto';
  var ctx = canvas.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  ctx.clearRect(0, 0, W, H);

  var pad = { top: 30, right: 30, bottom: 42, left: 50 };
  var plotW = W - pad.left - pad.right;
  var plotH = H - pad.top - pad.bottom;

  // 背景
  ctx.fillStyle = 'rgba(10,5,25,0.6)';
  ctx.fillRect(0, 0, W, H);

  // Y轴参考线 + 标签
  var yLabels = ['5 大吉','4 吉','3 中吉','2 末吉','1 凶','0 大凶'];
  ctx.font = '10px "Microsoft YaHei","PingFang SC",sans-serif';
  ctx.textAlign = 'right';
  ctx.textBaseline = 'middle';
  for (var y = 0; y <= 5; y++) {
    var py = pad.top + (5 - y) / 5 * plotH;
    ctx.strokeStyle = 'rgba(157,78,221,0.12)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(pad.left, py);
    ctx.lineTo(W - pad.right, py);
    ctx.stroke();
    ctx.fillStyle = 'rgba(160,144,192,0.5)';
    ctx.fillText(yLabels[y], pad.left - 6, py);
  }

  // X轴标签
  ctx.textAlign = 'center';
  ctx.textBaseline = 'top';
  ctx.fillStyle = 'rgba(160,144,192,0.5)';
  ctx.font = '10px "Microsoft YaHei","PingFang SC",sans-serif';
  for (var i = 0; i < data.length; i++) {
    var px = pad.left + i / (data.length - 1) * plotW;
    ctx.fillText(data[i].label, px, pad.top + plotH + 8);
  }

  // 收集有效数据点
  var points = [];
  for (var i = 0; i < data.length; i++) {
    if (data[i].score !== null) {
      points.push({
        x: pad.left + i / (data.length - 1) * plotW,
        y: pad.top + (5 - data[i].score) / 5 * plotH,
        score: data[i].score,
        idx: i
      });
    }
  }

  if (points.length === 0) {
    ctx.fillStyle = 'rgba(200,180,220,0.4)';
    ctx.font = '14px "Microsoft YaHei","PingFang SC",sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('暂无数据', W/2, H/2);
    return;
  }

  // 颜色函数：分数0→红(HSL 0), 5→绿(HSL 120)
  function scoreColor(score) {
    var h = score / 5 * 120; // 0→120
    return 'hsl(' + h + ', 80%, 50%)';
  }

  // 绘制填充区域（分段）
  for (var i = 0; i < points.length - 1; i++) {
    var p1 = points[i];
    var p2 = points[i + 1];
    var midScore = (p1.score + p2.score) / 2;
    var grad = ctx.createLinearGradient(p1.x, p1.y, p1.x, pad.top + plotH);
    grad.addColorStop(0, scoreColor(p1.score).replace(')', ', 0.25)').replace('hsl', 'hsla'));
    grad.addColorStop(1, 'rgba(157,78,221,0.02)');
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.lineTo(p2.x, pad.top + plotH);
    ctx.lineTo(p1.x, pad.top + plotH);
    ctx.closePath();
    ctx.fill();
  }

  // 连线（分段着色）
  for (var i = 0; i < points.length - 1; i++) {
    var p1 = points[i];
    var p2 = points[i + 1];
    var midScore = (p1.score + p2.score) / 2;

    // 检查是否有缺失间隔
    if (p2.idx - p1.idx > 1) {
      // 虚线连接缺失
      ctx.setLineDash([4, 4]);
      ctx.strokeStyle = 'rgba(200,180,220,0.35)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.stroke();
      ctx.setLineDash([]);
    } else {
      ctx.strokeStyle = scoreColor(midScore);
      ctx.lineWidth = 2;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(p1.x, p1.y);
      ctx.lineTo(p2.x, p2.y);
      ctx.stroke();
    }
  }

  // 数据点圆
  for (var i = 0; i < points.length; i++) {
    var p = points[i];
    // 外发光
    ctx.shadowColor = scoreColor(p.score);
    ctx.shadowBlur = 8;
    ctx.fillStyle = scoreColor(p.score);
    ctx.beginPath();
    ctx.arc(p.x, p.y, 4, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    // 白芯
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(p.x, p.y, 1.8, 0, Math.PI * 2);
    ctx.fill();
  }

  // 缺失天：空心圆标记
  for (var i = 0; i < data.length; i++) {
    if (data[i].score === null) {
      var px = pad.left + i / (data.length - 1) * plotW;
      var py = pad.top + plotH / 2;
      ctx.strokeStyle = 'rgba(200,180,220,0.25)';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(px, py, 3, 0, Math.PI * 2);
      ctx.stroke();
      ctx.fillStyle = 'rgba(200,180,220,0.15)';
      ctx.beginPath();
      ctx.arc(px, py, 1, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}

function analyzeTrend(data) {
  var valid = data.filter(function(d) { return d.score !== null; });
  if (valid.length < 2) return '数据不足 — 多抽几天签再来看命盘吧 🔮';

  var scores = valid.map(function(d) { return d.score; });
  var first = scores[0];
  var last = scores[scores.length - 1];
  var diff = last - first;
  var n = scores.length;

  // 标准差
  var avg = scores.reduce(function(a, b) { return a + b; }, 0) / n;
  var variance = scores.reduce(function(a, b) { return a + (b - avg) * (b - avg); }, 0) / n;
  var std = Math.sqrt(variance);

  // 判断趋势
  if (diff >= 1.5) return '🚀 触底反弹！运势正在强势回升';
  if (diff <= -1.5) return '📉 高开低走，近期需多加小心';

  // 单调性检查
  var rising = true, falling = true;
  for (var i = 1; i < scores.length; i++) {
    if (scores[i] < scores[i - 1]) rising = false;
    if (scores[i] > scores[i - 1]) falling = false;
  }
  if (rising && diff > 0.5) return '✨ 稳步上升，好运连连';
  if (falling && diff < -0.5) return '🌧 运势回调，韬光养晦';

  if (std < 0.5) return '⚖ 持平稳健，波澜不惊';
  if (std >= 1.2) return '🎢 波动起伏，大起大落';

  return '🌤 运势有起有落，保持平常心';
}

// 打字机效果
function typewriterEffect(el, text, speed, callback) {
  el.textContent = '';
  var i = 0;
  // 对于隐藏签，使用glitch模式
  var isHiddenText = text.indexOf('⚠') >= 0;
  var baseSpeed = isHiddenText ? (speed || 60) : (speed || 40);

  function type() {
    if (i < text.length) {
      // glitch: 偶尔一次跳3个字符
      var chunk = 1;
      if (isHiddenText && Math.random() < 0.15) chunk = 3;
      i += chunk;
      if (i > text.length) i = text.length;
      el.textContent = text.substring(0, i);
      // 随机变速
      var nextSpeed = baseSpeed + (Math.random() - 0.5) * baseSpeed;
      setTimeout(type, nextSpeed);
    } else {
      if (callback) callback();
    }
  }
  type();
}

// ============================================================
function handleCardClick(type, evt) {
  if (Lottery.state.isAnimating) return;

  var card = document.querySelector('.card[data-type="' + type + '"]');
  if (!card) return;

  // 捕获点击坐标 (用于混合种子)
  if (evt && evt.clientX !== undefined) {
    lastClickX = evt.clientX;
    lastClickY = evt.clientY;
  }

  // 已锁定：直接显示缓存弹窗
  if (isLocked(type)) {
    showToast('☯ 今日卦象已定 · 宜静不宜动');
    var cached = getCachedResult(type);
    if (cached) {
      if (cached.isHidden) {
        openModal(cached, true);
      } else {
        openModal(cached, true);
      }
    }
    return;
  }

  // 预生成结果 (传入点击坐标)
  var result = generateResult(type, lastClickX, lastClickY);
  saveResult(type, result);
  Lottery.state.isAnimating = true;

  // === reduced-motion: 跳过动画，直接弹窗 ===
  if (reducedMotion) {
    if (result.isHidden) { showHiddenSign(result); }
    else { openModal(result, false); }
    Lottery.state.isAnimating = false;
    return;
  }

  // === 阶段 1: 摇晃 + 漂浮 emoji ===
  card.classList.add('shaking');
  spawnEmojiParticles(card);

  // === 阶段 2: 摇晃结束后飞签出场 ===
  setTimeout(function() {
    card.classList.remove('shaking');
    var center = getCardCenter(card);

    // 隐藏签走独立流程
    if (result.isHidden) {
      cleanupFlyingElements();
      showHiddenSignEnhanced(result);
      Lottery.state.isAnimating = false;
      return;
    }

    // 创建飞签
    var signEl = createFlyingSign(center.x - 7, center.y - 45);
    signEl.classList.add('fly-up');

    // === 阶段 3: 飞签悬停 → 展开 ===
    setTimeout(function() {
      signEl.classList.remove('fly-up');
      signEl.classList.add('hovering');
      // 将签定位到屏幕中央
      signEl.style.left = (window.innerWidth / 2 - 7) + 'px';
      signEl.style.top  = (window.innerHeight / 2 - 70) + 'px';

      // 悬停 0.5s 后展开
      setTimeout(function() {
        signEl.classList.remove('hovering');
        signEl.classList.add('reveal');

        // 创建签文浮现文字
        var textEl = document.createElement('div');
        textEl.className = 'sign-text-reveal';
        textEl.style.left = (window.innerWidth / 2 - 130) + 'px';
        textEl.style.top  = (window.innerHeight / 2 + 10) + 'px';
        document.body.appendChild(textEl);

        // 打字机效果
        typewriterEffect(textEl, result.text, 50, function() {
          // 打字完成 → pop 定签
          signEl.classList.remove('reveal');
          signEl.classList.add('pop-settle');

          // 等级氛围特效
          spawnAtmosphere(result);

          // 定签后 → 移除飞签，打开弹窗
          setTimeout(function() {
            cleanupFlyingElements();
            openModal(result, false);
            Lottery.state.isAnimating = false;
          }, 500);
        });

      }, 500); // hover 500ms

    }, 800); // fly 800ms

  }, 1500); // shake 1500ms
}

// 隐藏签增强版 (荧光绿+紫色交替)
function showHiddenSignEnhanced(result) {
  Lottery.state.lastResult = result;
  var overlay = document.getElementById('hiddenOverlay');
  var canvas = document.getElementById('hiddenSignCanvas');
  var ctx = canvas.getContext('2d');
  var textEl = document.getElementById('hiddenText');
  var closeBtn = document.getElementById('hiddenCloseBtn');

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  // 星空粒子
  var particles = [];
  for (var i = 0; i < 120; i++) {
    particles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      vx: (Math.random() - 0.5) * 2,
      vy: (Math.random() - 0.5) * 2,
      size: Math.random() * 3.5 + 1,
      alpha: Math.random() * 0.8 + 0.2,
      life: Math.random() * 200 + 50,
      color: Math.random() < 0.3 ? '#00ff00' : Math.random() < 0.5 ? '#bf00ff' : '#ffffff'
    });
  }

  var animId;
  function animateParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.life--;
      if (p.life <= 0) {
        p.x = Math.random() * canvas.width;
        p.y = Math.random() * canvas.height;
        p.life = Math.random() * 200 + 50;
      }
      ctx.fillStyle = p.color;
      ctx.globalAlpha = p.alpha * Math.min(1, p.life / 200);
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (overlay.classList.contains('active')) {
      animId = requestAnimationFrame(animateParticles);
    }
  }

  overlay.classList.add('active');
  document.body.style.overflow = 'hidden';
  closeBtn.classList.remove('show');
  textEl.textContent = '';
  textEl.classList.remove('glitch-flash');

  animateParticles();

  // 打字机展示
  setTimeout(function() {
    typewriterEffect(textEl, result.text, 45, function() {
      // 荧光绿+紫色交替闪烁
      textEl.classList.add('glitch-flash');
      setTimeout(function() {
        closeBtn.classList.add('show');
      }, 600);
    });
  }, 500);

  closeBtn.onclick = function() {
    overlay.classList.remove('active');
    document.body.style.overflow = '';
    if (animId) cancelAnimationFrame(animId);
    textEl.textContent = '';
    textEl.classList.remove('glitch-flash');
    updateCounter();
  };

  updateCounter();
}

  poster.innerHTML = posterHTML;

// 网格背景
(function() {
  var c = document.getElementById('gridCanvas');
  var ctx = c.getContext('2d');
  var w, h;

  function resize() {
    w = c.width = window.innerWidth;
    h = c.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  function drawGrid() {
    ctx.clearRect(0, 0, w, h);

    var horizonY = h * 0.58;
    var vanishX = w * 0.5;
    var cellCount = 24;
    var maxDepth = 70;
    var baseAlpha = reducedMotion ? 0.08 : 0.18;

    for (var depth = 1; depth <= maxDepth; depth++) {
      var t = depth / maxDepth;
      var ty = horizonY + (h - horizonY) * Math.pow(t, 1.6);
      if (ty > h + 2) break;

      var alpha = baseAlpha * (1 - t) * 0.9;
      var lineW = 0.5 + (1 - t) * 1.0;

      ctx.beginPath();
      ctx.moveTo(0, ty);
      ctx.lineTo(w, ty);
      ctx.strokeStyle = 'rgba(157,78,221,' + alpha + ')';
      ctx.lineWidth = lineW;
      ctx.stroke();
    }

    for (var i = -cellCount; i <= cellCount; i++) {
      var angle = (i / cellCount) * (Math.PI / 3);
      var dx = Math.sin(angle);
      var alpha = baseAlpha * 0.7;

      ctx.beginPath();
      ctx.moveTo(vanishX, horizonY);
      var endX = vanishX + dx * (h - horizonY) * 3;
      ctx.lineTo(endX, h);
      ctx.strokeStyle = 'rgba(0,245,255,' + alpha + ')';
      ctx.lineWidth = 0.4;
      ctx.stroke();
    }
  }

  function loop() {
    drawGrid();
    requestAnimationFrame(loop);
  }
  loop();
})();

// 数字雨背景
(function() {
  var c = document.getElementById('rainCanvas');
  var ctx = c.getContext('2d');
  var w, h;
  var drops = [];
  var DROP_COUNT = 40;

  function resize() {
    w = c.width = window.innerWidth;
    h = c.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  var chars = '01';
  for (var i = 0; i < DROP_COUNT; i++) {
    drops.push({
      x: Math.random() * w,
      y: Math.random() * h,
      speed: Math.random() * 0.6 + 0.2,
      char: chars[Math.floor(Math.random() * chars.length)],
      alpha: Math.random() * 0.15 + 0.05,
      color: Math.random() < 0.6 ? '157,78,221' : '0,245,255'
    });
  }

  function drawRain() {
    ctx.clearRect(0, 0, w, h);
    ctx.font = '12px "Courier New", monospace';

    if (reducedMotion) {
      for (var i = 0; i < drops.length; i++) {
        var d = drops[i];
        ctx.fillStyle = 'rgba(' + d.color + ',' + (d.alpha * 0.5) + ')';
        ctx.fillText(d.char, d.x, d.y);
      }
      return;
    }

    for (var i = 0; i < drops.length; i++) {
      var d = drops[i];
      ctx.fillStyle = 'rgba(' + d.color + ',' + d.alpha + ')';
      ctx.fillText(d.char, d.x, d.y);
      d.y += d.speed;
      if (d.y > h + 20) {
        d.y = -20;
        d.x = Math.random() * w;
      }
    }
  }

  function loop() {
    drawRain();
    requestAnimationFrame(loop);
  }
  loop();
})();

(function() {
  // 弹出关闭
  document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
  document.getElementById('modalOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });

  // 海报按钮
  document.getElementById('modalPosterBtn').addEventListener('click', generatePoster);

  // 隐藏签关闭（点击覆盖层背景）
  document.getElementById('hiddenOverlay').addEventListener('click', function(e) {
    if (e.target === this) {
      document.getElementById('hiddenCloseBtn').click();
    }
  });

  // ESC 关闭
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      var chartOvl = document.getElementById('chartOverlay');
      var hiddenOvl = document.getElementById('hiddenOverlay');
      var modalOvl = document.getElementById('modalOverlay');
      if (hiddenOvl.classList.contains('active')) {
        document.getElementById('hiddenCloseBtn').click();
      } else if (chartOvl.classList.contains('active')) {
        closeChartModal();
      } else if (modalOvl.classList.contains('active')) {
        closeModal();
      }
    }
  });

  // 命盘按钮
  document.getElementById('chartBtn').addEventListener('click', openChartModal);
  document.getElementById('chartCloseBtn').addEventListener('click', closeChartModal);
  document.getElementById('chartOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeChartModal();
  });

  // 卡片点击
  var cards = document.querySelectorAll('.card');
  for (var i = 0; i < cards.length; i++) {
    (function(card) {
      card.addEventListener('click', function(e) {
        var type = card.getAttribute('data-type');
        if (type) handleCardClick(type, e);
      });
    })(cards[i]);
  }

  // 初始化计数器
  updateCounter();
})();
</script>
