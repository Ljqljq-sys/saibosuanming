<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>赛博抽签 · 玄不救非</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<style>
  :root {
    --purple: #9d4edd;
    --pink: #e040fb;
    --cyan: #00f5ff;
    --card-bg: rgba(15, 5, 30, 0.82);
    --gold: #f0c040;
    --red: #ff5577;
    --green: #55ddaa;
    --orange: #ff8844;
  }
  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background: radial-gradient(ellipse at 50% 60%, #14082a 0%, #0a0015 45%, #050510 100%);
    color: #e0d0f0;
    font-family: "Microsoft YaHei","PingFang SC","Helvetica Neue",sans-serif;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    overflow-x:hidden; position:relative;
    padding: 80px 20px 40px;
  }

  /* ===== Canvas 背景 ===== */
  #gridCanvas, #rainCanvas {
    position:fixed; top:0; left:0; width:100%; height:100%; z-index:0; pointer-events:none;
  }
  #gridCanvas  { z-index:0; }
  #rainCanvas { z-index:1; }

  /* ===== 光晕 ===== */
  .glow-orb {
    position:fixed; top:50%; left:50%; transform:translate(-50%,-50%);
    width:min(500px,80vw); height:min(500px,80vw);
    background:radial-gradient(circle, rgba(157,78,221,0.14) 0%, rgba(0,245,255,0.04) 30%, transparent 70%);
    border-radius:50%; filter:blur(60px); z-index:0; pointer-events:none;
    animation:orbPulse 4s ease-in-out infinite;
  }
  @keyframes orbPulse {
    0%,100% { transform:translate(-50%,-50%) scale(0.9); opacity:0.5; }
    50%     { transform:translate(-50%,-50%) scale(1.3); opacity:1; }
  }

  /* ===== 顶栏 ===== */
  .top-bar {
    position:fixed; top:0; left:0; right:0; z-index:10;
    background:rgba(15,5,30,0.85); backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    border-bottom:1px solid rgba(157,78,221,0.2);
    padding:10px 20px; display:flex; align-items:center; justify-content:space-between;
    font-size:13px;
  }
  .top-bar .counter { color:var(--cyan); font-family:'Orbitron',sans-serif; letter-spacing:1px; }
  .top-bar .date   { color:rgba(160,144,192,0.5); font-size:11px; }
  .back-btn {
    font-family:'Orbitron',sans-serif; font-size:11px; letter-spacing:2px;
    color:rgba(200,180,220,0.7); text-decoration:none;
    padding:6px 16px; border:1px solid rgba(157,78,221,0.3);
    border-radius:20px; transition:all 0.3s;
  }
  .back-btn:hover { color:#fff; border-color:var(--purple); box-shadow:0 0 12px rgba(157,78,221,0.3); }

  /* ===== 主容器 ===== */
  .main {
    position:relative; z-index:3; text-align:center;
    width:100%; max-width:660px;
  }

  .title {
    font-family:'Orbitron','Microsoft YaHei',sans-serif;
    font-size:clamp(22px,4vw,34px); font-weight:900; letter-spacing:4px;
    color:#fff;
    text-shadow:0 0 10px var(--purple),0 0 30px var(--purple),0 0 60px rgba(157,78,221,0.5);
    margin-bottom:4px;
    animation:titleGlow 2s ease-in-out infinite alternate;
  }
  @keyframes titleGlow {
    from { text-shadow:0 0 10px var(--purple),0 0 30px var(--purple),0 0 60px rgba(157,78,221,0.5); }
    to   { text-shadow:0 0 20px var(--purple),0 0 50px var(--pink),0 0 80px rgba(224,64,251,0.6); }
  }
  .subtitle {
    font-family:'Orbitron',sans-serif;
    font-size:clamp(10px,1.6vw,12px); letter-spacing:5px;
    color:rgba(160,144,192,0.5); margin-bottom:36px;
  }

  /* ===== 卡片网格 ===== */
  .cards {
    display:grid; grid-template-columns:repeat(3, 1fr); gap:18px;
  }

  .card {
    background:var(--card-bg);
    border:1px solid rgba(157,78,221,0.25);
    border-radius:18px; padding:28px 16px 22px;
    cursor:pointer; position:relative; overflow:hidden;
    transition:transform 0.35s cubic-bezier(.34,1.56,.64,1), box-shadow 0.35s, border-color 0.35s, opacity 0.35s, filter 0.35s;
    opacity:0; transform:translateY(30px);
    animation:fadeInUp 0.6s ease forwards;
    backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);
    user-select:none; -webkit-tap-highlight-color:transparent;
  }
  .card:nth-child(1) { animation-delay:0.00s; }
  .card:nth-child(2) { animation-delay:0.07s; }
  .card:nth-child(3) { animation-delay:0.14s; }
  .card:nth-child(4) { animation-delay:0.21s; }
  .card:nth-child(5) { animation-delay:0.28s; }
  .card:nth-child(6) { animation-delay:0.35s; }
  @keyframes fadeInUp {
    to { opacity:1; transform:translateY(0); }
  }

  .card::before {
    content:''; position:absolute; top:0; left:0; width:100%; height:100%;
    background:radial-gradient(ellipse at 50% 0%, rgba(157,78,221,0.10) 0%, transparent 70%);
    opacity:0; transition:opacity 0.35s;
  }
  .card:hover { transform:translateY(-8px); box-shadow:0 0 28px rgba(157,78,221,0.3),0 0 50px rgba(224,64,251,0.12),0 8px 30px rgba(0,0,0,0.5); border-color:rgba(157,78,221,0.6); }
  .card:hover::before { opacity:1; }
  .card:active { transform:scale(0.95) translateY(-4px); transition:transform 0.1s; }

  /* 锁定状态 */
  .card.locked {
    opacity:0.5; cursor:default; filter:grayscale(0.35);
  }
  .card.locked:hover { transform:none; box-shadow:none; border-color:rgba(157,78,221,0.25); }
  .card.locked:hover::before { opacity:0; }
  .card.locked::after {
    content:'🔒'; position:absolute; top:10px; right:14px; font-size:14px;
    opacity:0.7; z-index:2;
  }
  /* 已抽标记 */
  .card.done::after {
    content:'✅'; position:absolute; top:10px; right:14px; font-size:14px;
    opacity:0.8; z-index:2;
  }

  .card-icon {
    font-size:clamp(32px,5.5vw,46px); margin-bottom:8px;
    position:relative; z-index:1; display:block;
    transition:transform 0.35s;
  }
  .card:hover .card-icon { transform:scale(1.1); }
  .card.locked:hover .card-icon { transform:none; }

  .card-label {
    font-family:'Orbitron','Microsoft YaHei',sans-serif;
    font-size:clamp(13px,2vw,16px); font-weight:700; letter-spacing:2px;
    position:relative; z-index:1;
  }
  .card-desc {
    font-size:11px; color:#706090; margin-top:4px;
    position:relative; z-index:1;
  }

  /* 摇晃动画 */
  .card.shaking {
    animation:cardShake 0.5s ease-in-out !important;
  }
  @keyframes cardShake {
    0%,100% { transform:translateX(0); }
    10%,30%,50%,70%,90% { transform:translateX(-6px); }
    20%,40%,60%,80% { transform:translateX(6px); }
  }
  /* 图标飞出 */
  .card .card-icon.flyOut {
    animation:signFlyOut 0.6s ease-out forwards;
  }
  @keyframes signFlyOut {
    0%   { transform:scale(1); opacity:1; }
    50%  { transform:scale(2.5) translateY(-20px); opacity:0.8; }
    100% { transform:scale(3.5) translateY(-60px); opacity:0; }
  }

  /* ===== 结果弹窗 ===== */
  .modal-overlay {
    position:fixed; inset:0; z-index:50; background:rgba(0,0,0,0.78);
    backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
    display:flex; align-items:center; justify-content:center;
    opacity:0; pointer-events:none;
    transition:opacity 0.3s;
  }
  .modal-overlay.active { opacity:1; pointer-events:auto; }

  .modal {
    background:var(--card-bg);
    border:1px solid rgba(157,78,221,0.35);
    border-radius:20px; padding:32px 24px 24px;
    max-width:440px; width:90%; max-height:85vh; overflow-y:auto;
    position:relative;
    transform:translateY(30px);
    transition:transform 0.35s cubic-bezier(.34,1.56,.64,1);
  }
  .modal-overlay.active .modal { transform:translateY(0); }

  /* 等级边框颜色 */
  .modal.level-大吉 { border-color:rgba(240,192,64,0.7); box-shadow:0 0 30px rgba(240,192,64,0.2); }
  .modal.level-吉   { border-color:rgba(0,245,255,0.6); box-shadow:0 0 20px rgba(0,245,255,0.15); }
  .modal.level-中吉 { border-color:rgba(85,221,170,0.6); box-shadow:0 0 20px rgba(85,221,170,0.12); }
  .modal.level-末吉 { border-color:rgba(221,170,85,0.5); }
  .modal.level-凶   { border-color:rgba(255,136,68,0.6); box-shadow:0 0 20px rgba(255,136,68,0.12); }
  .modal.level-大凶 { border-color:rgba(255,85,119,0.7); box-shadow:0 0 30px rgba(255,85,119,0.2); }
  .modal.level-？？？ { border-color:#00ff00; box-shadow:0 0 40px rgba(0,255,0,0.3); }

  .modal-header {
    text-align:center; margin-bottom:20px;
  }
  .modal-level {
    font-family:'Orbitron',sans-serif; font-size:28px; font-weight:900; letter-spacing:3px;
    margin-bottom:4px;
  }
  .modal-type {
    font-size:12px; color:#706090; letter-spacing:2px;
  }
  .modal-divider {
    width:60px; height:1px; margin:16px auto;
    background:linear-gradient(90deg, transparent, rgba(157,78,221,0.5), transparent);
  }
  .modal-text {
    font-size:15px; line-height:1.8; text-align:center;
    color:#d0c8e4; margin-bottom:20px;
    min-height:50px;
  }
  .modal-lucky-row {
    display:flex; gap:12px; justify-content:center; margin-bottom:20px;
  }
  .modal-lucky-item {
    flex:1; max-width:140px; background:rgba(157,78,221,0.08);
    border-radius:12px; padding:12px; text-align:center;
    border:1px solid rgba(157,78,221,0.15);
  }
  .modal-lucky-item .swatch {
    display:inline-block; width:22px; height:22px; border-radius:50%;
    vertical-align:middle; margin-right:6px;
  }
  .modal-lucky-item .lucky-label { font-size:10px; color:#706090; letter-spacing:1px; margin-bottom:4px; }
  .modal-lucky-item .lucky-val  { font-size:13px; color:#e0d0f0; font-family:'Orbitron',sans-serif; }

  .modal-advice {
    display:flex; gap:12px; margin-bottom:20px;
  }
  .modal-do, .modal-dont {
    flex:1; padding:12px; border-radius:12px; font-size:12px; line-height:1.6;
  }
  .modal-do   { background:rgba(85,221,170,0.08); border:1px solid rgba(85,221,170,0.2); color:#a0e8cc; }
  .modal-dont { background:rgba(255,85,119,0.08); border:1px solid rgba(255,85,119,0.2); color:#f0a0b0; }

  .modal-btns {
    display:flex; gap:10px; justify-content:center; flex-wrap:wrap;
  }
  .btn {
    font-family:'Orbitron','Microsoft YaHei',sans-serif; font-size:12px; letter-spacing:2px;
    padding:10px 20px; border-radius:25px; cursor:pointer; border:none;
    transition:all 0.3s; font-weight:700;
  }
  .btn-close {
    background:rgba(255,255,255,0.06); color:rgba(200,180,220,0.6);
    border:1px solid rgba(157,78,221,0.2);
  }
  .btn-close:hover { background:rgba(255,255,255,0.1); color:#e0d0f0; }
  .btn-poster {
    background:linear-gradient(135deg, rgba(157,78,221,0.3), rgba(224,64,251,0.2));
    color:#e0d0f0; border:1px solid rgba(224,64,251,0.3);
  }
  .btn-poster:hover { box-shadow:0 0 20px rgba(157,78,221,0.35); transform:translateY(-2px); }
  .btn-poster:active { transform:scale(0.95); }
  .btn-poster:disabled { opacity:0.4; cursor:not-allowed; transform:none; }

  /* ===== 隐藏签覆盖层 ===== */
  .hidden-overlay {
    position:fixed; inset:0; z-index:100; background:#000;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    opacity:0; pointer-events:none; transition:opacity 0.2s;
  }
  .hidden-overlay.active { opacity:1; pointer-events:auto; }
  #hiddenSignCanvas {
    position:absolute; top:0; left:0; width:100%; height:100%;
  }
  .hidden-text {
    position:relative; z-index:2;
    font-family:'Courier New',monospace; font-size:clamp(14px,2.5vw,18px);
    color:#00ff00; text-align:center; line-height:2;
    text-shadow:0 0 10px #00ff00,0 0 30px #00ff00,0 0 60px rgba(0,255,0,0.5);
    padding:20px; max-width:500px; white-space:pre-wrap;
    min-height:80px;
  }
  .hidden-close {
    position:relative; z-index:2; margin-top:30px;
    font-family:'Courier New',monospace; font-size:14px; letter-spacing:3px;
    color:#00ff00; background:transparent; border:1px solid #00ff00;
    padding:10px 30px; border-radius:25px; cursor:pointer;
    opacity:0; transition:opacity 0.6s;
    text-shadow:0 0 8px #00ff00;
  }
  .hidden-close.show { opacity:1; }
  .hidden-close:hover { background:rgba(0,255,0,0.1); box-shadow:0 0 20px rgba(0,255,0,0.3); }

  /* ===== Toast ===== */
  .toast {
    position:fixed; bottom:40px; left:50%; transform:translateX(-50%);
    background:rgba(30,10,50,0.95); color:#e0d0f0;
    padding:12px 24px; border-radius:30px; font-size:14px;
    border:1px solid rgba(224,64,251,0.4);
    box-shadow:0 0 20px rgba(224,64,251,0.2);
    z-index:999; opacity:0; pointer-events:none;
    transition:opacity 0.4s, transform 0.4s;
    transform:translateX(-50%) translateY(20px);
  }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  /* ===== 海报渲染区 (离屏) ===== */
  #posterWrap {
    position:fixed; left:-9999px; top:0; z-index:-1;
  }
  .poster {
    width:420px; background:linear-gradient(160deg, #0d0020 0%, #12062a 30%, #0a0418 100%);
    padding:28px 24px; position:relative; overflow:hidden;
  }
  .poster-border {
    position:absolute; top:10px; left:10px; right:10px; bottom:10px;
    border:1px solid rgba(157,78,221,0.3); pointer-events:none;
  }
  .poster-corner {
    position:absolute; width:24px; height:24px; pointer-events:none;
  }
  .pc-tl { top:6px; left:6px; border-top:2px solid var(--gold); border-left:2px solid var(--gold); }
  .pc-tr { top:6px; right:6px; border-top:2px solid var(--gold); border-right:2px solid var(--gold); }
  .pc-bl { bottom:6px; left:6px; border-bottom:2px solid var(--gold); border-left:2px solid var(--gold); }
  .pc-br { bottom:6px; right:6px; border-bottom:2px solid var(--gold); border-right:2px solid var(--gold); }
  .poster-stars { position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; }
  .poster-star {
    position:absolute; width:2px; height:2px; background:#fff; border-radius:50%;
    animation:psTwinkle 2s ease-in-out infinite;
  }
  @keyframes psTwinkle {
    0%,100% { opacity:0.3; }
    50%     { opacity:1; }
  }
  .poster-inner { position:relative; z-index:1; }
  .poster-header { text-align:center; margin-bottom:18px; }
  .ph-icon { font-size:36px; margin-bottom:4px; }
  .ph-title {
    font-family:'Orbitron',sans-serif; font-size:16px; font-weight:900;
    letter-spacing:4px; color:var(--gold);
  }
  .ph-divider {
    width:40px; height:1px; margin:10px auto;
    background:linear-gradient(90deg,transparent,var(--gold),transparent);
  }
  .poster-meta { text-align:center; font-size:11px; color:#8090a0; margin-bottom:16px; line-height:1.8; }
  .poster-level {
    text-align:center; font-family:'Orbitron',sans-serif; font-size:36px; font-weight:900;
    letter-spacing:4px; margin-bottom:4px;
  }
  .poster-level-sub {
    text-align:center; font-size:11px; color:#706090; letter-spacing:2px; margin-bottom:16px;
  }
  .poster-fortune-text {
    text-align:center; font-size:14px; color:#d0c8e4; line-height:1.8; margin-bottom:18px;
    padding:0 10px;
  }
  .poster-lucky-row {
    display:flex; gap:10px; margin-bottom:16px;
  }
  .poster-lucky-item {
    flex:1; text-align:center; padding:10px 8px;
    background:rgba(157,78,221,0.08); border-radius:10px;
    border:1px solid rgba(157,78,221,0.15);
  }
  .poster-lucky-item .pl-swatch {
    display:inline-block; width:18px; height:18px; border-radius:50%;
    vertical-align:middle; margin-right:6px;
  }
  .poster-lucky-item .pl-label { font-size:10px; color:#706090; letter-spacing:1px; }
  .poster-lucky-item .pl-val { font-size:13px; color:#e0d0f0; font-family:'Orbitron',sans-serif; }
  .poster-advice { margin-bottom:18px; }
  .poster-do, .poster-dont {
    font-size:11px; padding:8px 12px; border-radius:8px; margin-bottom:6px;
  }
  .poster-do   { color:#a0e8cc; background:rgba(85,221,170,0.06); border:1px solid rgba(85,221,170,0.15); }
  .poster-dont { color:#f0a0b0; background:rgba(255,85,119,0.06); border:1px solid rgba(255,85,119,0.15); }
  .poster-footer { text-align:center; font-size:10px; color:#504060; line-height:2; }
  .pf-brand { font-family:'Orbitron',sans-serif; letter-spacing:2px; font-size:11px; color:#706090; }
  .pf-watermark {
    font-size:clamp(18px,5vw,28px); color:rgba(255,255,255,0.04);
    position:absolute; bottom:90px; left:50%; transform:translateX(-50%) rotate(-15deg);
    letter-spacing:8px; font-weight:900; pointer-events:none; white-space:nowrap;
  }
  .poster-qr { margin-top:10px; }

  /* ===== 响应式 ===== */
  @media (max-width:560px) {
    .cards { grid-template-columns:repeat(2, 1fr); gap:12px; }
    .card { padding:22px 10px 16px; border-radius:14px; }
    .card:hover { transform:translateY(-5px); }
    .card:active { transform:scale(0.97) translateY(-3px); }
    .modal { padding:24px 16px 18px; }
    .modal-level { font-size:22px; }
    .modal-text { font-size:14px; }
    .modal-advice { flex-direction:column; }
    .modal-lucky-row { flex-wrap:wrap; }
    .top-bar { padding:8px 12px; font-size:11px; }
    #gridCanvas, #rainCanvas { opacity:0.5; }
  }
  @media (max-width:380px) {
    .cards { grid-template-columns:repeat(2, 1fr); gap:8px; }
    .card { padding:16px 6px 12px; }
  }

  /* ===== 减少动画 ===== */
  @media (prefers-reduced-motion: reduce) {
    .glow-orb { animation:none; opacity:0.5; }
    .title { animation:none; }
    .card { animation:none; opacity:1; transform:none; }
    .card.shaking { animation:none !important; }
    .card .card-icon.flyOut { animation:none; }
    .modal { transition:none; }
    .modal-overlay { transition:none; }
    #gridCanvas, #rainCanvas { opacity:0.3; }
  }

  /* 响应式 - 顶栏下方留白 */
  @media (max-width:560px) {
    body { padding-top:70px; }
  }

  /* ===== 滚动条美化 ===== */
  .modal::-webkit-scrollbar { width:4px; }
  .modal::-webkit-scrollbar-thumb { background:rgba(157,78,221,0.3); border-radius:2px; }
</style>
</head>
<body>

<!-- 背景 -->
<canvas id="gridCanvas"></canvas>
<canvas id="rainCanvas"></canvas>
<div class="glow-orb"></div>

<!-- 顶栏 -->
<div class="top-bar">
  <a class="back-btn" href="index.html">◂ 首页</a>
  <span class="counter" id="counter">今日已抽 0/6</span>
  <span class="date" id="dateDisplay"></span>
</div>

<!-- 主内容 -->
<div class="main">
  <h1 class="title">赛 博 抽 签</h1>
  <p class="subtitle">// LOTTERY_PROTOCOL_ACTIVE //</p>

  <div class="cards" id="cards">
    <div class="card" data-type="wealth">
      <span class="card-icon">💰</span>
      <div class="card-label">财 运</div>
      <div class="card-desc">财源滚滚签</div>
    </div>
    <div class="card" data-type="love">
      <span class="card-icon">🌸</span>
      <div class="card-label">桃 花</div>
      <div class="card-desc">姻缘红线签</div>
    </div>
    <div class="card" data-type="study">
      <span class="card-icon">📚</span>
      <div class="card-label">学 业</div>
      <div class="card-desc">金榜题名签</div>
    </div>
    <div class="card" data-type="career">
      <span class="card-icon">💼</span>
      <div class="card-label">事 业</div>
      <div class="card-desc">步步高升签</div>
    </div>
    <div class="card" data-type="general">
      <span class="card-icon">🎰</span>
      <div class="card-label">综 合</div>
      <div class="card-desc">万事如意签</div>

function hashStr(s) {
  var h = 0;
  for (var i = 0; i < s.length; i++) {
    h = ((h << 5) - h + s.charCodeAt(i)) | 0;
  }
  return Math.abs(h);
}

// mulberry32 PRNG — 确定性伪随机数生成器
function createRNG(seed) {
  var s = seed | 0;
  return function() {
    s = (s + 0x6D2B79F5) | 0;
    var t = Math.imul(s ^ (s >>> 15), s | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function shuffle(arr, seed) {
  var a = arr.slice();
  for (var i = a.length - 1; i > 0; i--) {
    var j = (seed * (i + 1) * 31) % (i + 1);
    var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
  }
  return a;
}

function hslToHex(h, s, l) {
  s /= 100; l /= 100;
  var c = (1 - Math.abs(2 * l - 1)) * s;
  var x = c * (1 - Math.abs(((h / 60) % 2) - 1));
  var m = l - c / 2;
  var r, g, b;
  if (h < 60) { r = c; g = x; b = 0; }
  else if (h < 120) { r = x; g = c; b = 0; }
  else if (h < 180) { r = 0; g = c; b = x; }
  else if (h < 240) { r = 0; g = x; b = c; }
  else if (h < 300) { r = x; g = 0; b = c; }
  else { r = c; g = 0; b = x; }
  var toHex = function(v) {
    var hx = Math.round((v + m) * 255).toString(16);
    return hx.length === 1 ? '0' + hx : hx;
  };
  return '#' + toHex(r) + toHex(g) + toHex(b);
}

function getColorName(h) {
  var colors = [
    {n:'赛博红',  h:0},  {n:'赤橙',    h:15}, {n:'日落橙', h:30},
    {n:'琥珀金', h:45},  {n:'赛博金',  h:55}, {n:'荧光黄', h:65},

    {n:'极客青', h:175}, {n:'数据蓝',  h:200},{n:'赛博蓝', h:220},
    {n:'矩阵紫', h:260}, {n:'赛博紫',  h:280},{n:'霓虹粉', h:310},
    {n:'赛博粉', h:330}, {n:'幻紫',    h:345},{n:'赛博红', h:360}
  ];
  var best = colors[0], bestD = 360;
  for (var i = 0; i < colors.length; i++) {
    var d = Math.abs(h - colors[i].h);
    if (d < bestD) { bestD = d; best = colors[i]; }
  }
  return best.n;
}

function getTodayKey() {
  var d = new Date();
  return d.getFullYear() + '-' +
    String(d.getMonth() + 1).padStart(2, '0') + '-' +
    String(d.getDate()).padStart(2, '0');
}

function storageKey(type) {
  return 'lottery_' + type + '_' + getTodayKey();
}

function isLocked(type) {
  return localStorage.getItem(storageKey(type)) !== null;
}

function getCachedResult(type) {
  var raw = localStorage.getItem(storageKey(type));
  if (!raw) return null;
  try { return JSON.parse(raw); }
  catch(e) { return null; }
}

function weightedLevel(rng) {
  var roll = rng() * 100;
  for (var i = 0; i < WEIGHT_CUMULATIVE.length; i++) {
    if (roll < WEIGHT_CUMULATIVE[i]) return LEVEL_WEIGHTS[i];
  }
  return LEVEL_WEIGHTS[LEVEL_WEIGHTS.length - 1];
}

function generateResult(type) {
  var todayKey = getTodayKey();

  // 随机签：先确定子类型
  var effectiveType = type;
  if (type === 'random') {
    var subSeed = hashStr(todayKey + '_' + type + '_sub_v1');
    var subRng = createRNG(subSeed);
    effectiveType = LOTTERY_TYPES[Math.floor(subRng() * LOTTERY_TYPES.length)];
  }

  // 种子
  var seed = hashStr(todayKey + '_' + effectiveType + '_v1');
  var rng = createRNG(seed);

  // 获取对应数据库
  var dbMap = {
    wealth: FORTUNE_WEALTH, love: FORTUNE_LOVE, study: FORTUNE_STUDY,
    career: FORTUNE_CAREER, general: FORTUNE_GENERAL, random: FORTUNE_GENERAL
  };
  var db = dbMap[effectiveType] || FORTUNE_GENERAL;

  // 隐藏签检测
  var hiddenRoll = rng();
  var isHidden = hiddenRoll < 0.0005;

  var result;
  if (isHidden) {
    result = {
      type: type,
      effectiveType: effectiveType,
      level: '？？？',
      levelColor: '#00ff00',
      levelEmoji: '👽',
      text: HIDDEN_SIGNS[type] || HIDDEN_SIGNS['random'],
      do: ['保持怀疑','检查系统日志'],
      dont: ['相信一切','关闭防火墙'],
      luckyColor: '#00ff00',
      luckyColorName: '骇客绿',
      luckyNumber: (Math.floor(rng() * 99) + 1),
      luckyNumberComment: 'Error 404: Meaning Not Found',
      luckyDirection: '第四维度',
      isHidden: true,
      date: todayKey,
      timestamp: Date.now()
    };
  } else {
    // 等级
    var levelInfo = weightedLevel(rng);
    // 签文
    var entries = db[levelInfo.level];
    var entryIdx = Math.floor(rng() * entries.length);
    var text = entries[entryIdx];

    // 幸运属性
    var hue = Math.floor(rng() * 360);
    var luckyColor = hslToHex(hue, 65 + (seed % 20), 50 + (Math.floor(rng() * 15)));
    var luckyColorName = getColorName(hue);
    var luckyNumber = Math.floor(rng() * 99) + 1;
    var luckyNumberComment = getNumComment(luckyNumber);
    var luckyDirection = DIRECTIONS[Math.floor(rng() * DIRECTIONS.length)];

    // 宜忌
    var shuffledDo = shuffle(DO_ACTIONS, seed + 333);
    var shuffledDont = shuffle(DONT_ACTIONS, seed + 777);
    var doItems = [shuffledDo[Math.floor(rng() * shuffledDo.length)], shuffledDo[(Math.floor(rng() * shuffledDo.length) + 7) % shuffledDo.length]];
    var dontItems = [shuffledDont[Math.floor(rng() * shuffledDont.length)], shuffledDont[(Math.floor(rng() * shuffledDont.length) + 5) % shuffledDont.length]];
    // 避免宜忌重叠
    if (dontItems[0] === doItems[0]) dontItems[0] = shuffledDont[(Math.floor(rng() * shuffledDont.length) + 13) % shuffledDont.length];
    if (dontItems[1] === doItems[1]) dontItems[1] = shuffledDont[(Math.floor(rng() * shuffledDont.length) + 17) % shuffledDont.length];

    result = {
      type: type,
      effectiveType: effectiveType,
      level: levelInfo.level,
      levelColor: levelInfo.color,
      levelEmoji: levelInfo.emoji,
      text: text,
      do: doItems,
      dont: dontItems,
      luckyColor: luckyColor,
      luckyColorName: luckyColorName,
      luckyNumber: luckyNumber,
      luckyNumberComment: luckyNumberComment,
      luckyDirection: luckyDirection,
      isHidden: false,
      date: todayKey,
      timestamp: Date.now()
    };
  }

  return result;
}

// 打字机效果
function typewriterEffect(el, text, speed, callback) {
  el.textContent = '';
  var i = 0;
  // 对于隐藏签，使用glitch模式
  var isHiddenText = text.indexOf('⚠') >= 0;
  var baseSpeed = isHiddenText ? (speed || 60) : (speed || 40);

  function type() {
    if (i < text.length) {
      // glitch: 偶尔一次跳3个字符
      var chunk = 1;
      if (isHiddenText && Math.random() < 0.15) chunk = 3;
      i += chunk;
      if (i > text.length) i = text.length;
      el.textContent = text.substring(0, i);
      // 随机变速
      var nextSpeed = baseSpeed + (Math.random() - 0.5) * baseSpeed;
      setTimeout(type, nextSpeed);
    } else {
      if (callback) callback();
    }
  }
  type();
}

  adviceHTML += '<div class="modal-dont"><strong>❌ 忌：</strong>' + result.dont.map(escapeHtml).join('、') + '</div>';
  document.getElementById('modalAdvice').innerHTML = adviceHTML;

  // 显示弹窗
  overlay.classList.add('active');
  document.body.style.overflow = 'hidden';

  // 打字机效果（仅首次展示）
  textEl.innerHTML = '';
  if (!isRevisit) {
    typewriterEffect(textEl, result.text, result.isHidden ? 50 : 30, function() {
      // 打字完成
    });
  } else {
    textEl.textContent = result.text;
  }

  // 更新计数器
  updateCounter();
}

function closeModal() {
  var overlay = document.getElementById('modalOverlay');
  overlay.classList.remove('active');
  document.body.style.overflow = '';
  Lottery.state.lastResult = null;
  // 清理打字机残留文本
  document.getElementById('modalText').textContent = '';
}

function showHiddenSign(result) {
  Lottery.state.lastResult = result;
  var overlay = document.getElementById('hiddenOverlay');
  var canvas = document.getElementById('hiddenSignCanvas');
  var ctx = canvas.getContext('2d');
  var textEl = document.getElementById('hiddenText');
  var closeBtn = document.getElementById('hiddenCloseBtn');

  // 设置 canvas 尺寸
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  // 粒子
  var particles = [];
  for (var i = 0; i < 100; i++) {
    particles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      vx: (Math.random() - 0.5) * 1.5,
      vy: (Math.random() - 0.5) * 1.5,
      size: Math.random() * 3 + 1,
      alpha: Math.random() * 0.8 + 0.2,
      life: Math.random() * 200 + 50,
      color: Math.random() < 0.3 ? '#00ff00' : '#ffffff'
    });
  }

  var animId;
  function animateParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (var i = 0; i < particles.length; i++) {
      var p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.life--;
      if (p.life <= 0) {
        p.x = Math.random() * canvas.width;
        p.y = Math.random() * canvas.height;
        p.life = Math.random() * 200 + 50;
      }
      ctx.fillStyle = p.color;
      ctx.globalAlpha = p.alpha * Math.min(1, p.life / 200);
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    if (overlay.classList.contains('active')) {
      animId = requestAnimationFrame(animateParticles);
    }
  }

  // 显示覆盖层
  overlay.classList.add('active');
  document.body.style.overflow = 'hidden';
  closeBtn.classList.remove('show');
  textEl.textContent = '';

  animateParticles();

  // 延迟后开始打字
  setTimeout(function() {
    typewriterEffect(textEl, result.text, 50, function() {
      // 显示关闭按钮
      setTimeout(function() {
        closeBtn.classList.add('show');
      }, 500);
    });
  }, 600);

  // 关闭按钮
  closeBtn.onclick = function() {
    overlay.classList.remove('active');
    document.body.style.overflow = '';
    if (animId) cancelAnimationFrame(animId);
    textEl.textContent = '';
    updateCounter();
  };

  // 更新计数器
  updateCounter();
}

// 卡片点击处理
function handleCardClick(type) {
  if (Lottery.state.isAnimating) return;

  var card = document.querySelector('.card[data-type="' + type + '"]');
  if (!card) return;

  // 已锁定：显示缓存
  if (isLocked(type)) {
    showToast('☯ 今日卦象已定 · 宜静不宜动');
    var cached = getCachedResult(type);
    if (cached) {
      if (cached.isHidden) {
        // 回看隐藏签用弹窗，不用全屏特效
        openModal(cached, true);
      } else {
        openModal(cached, true);
      }
    }
    return;
  }

  // 生成结果
  Lottery.state.isAnimating = true;

  // 摇晃动画
  card.classList.add('shaking');

  // 图标飞出
  var iconEl = card.querySelector('.card-icon');
  if (iconEl && !reducedMotion) {
    setTimeout(function() {
      iconEl.classList.add('flyOut');
    }, 150);
  }

  // 动画结束后展示结果
  var animDuration = reducedMotion ? 100 : 600;
  setTimeout(function() {
    card.classList.remove('shaking');
    if (iconEl) iconEl.classList.remove('flyOut');

    var result = generateResult(type);
    saveResult(type, result);

    if (result.isHidden) {
      showHiddenSign(result);
    } else {
      openModal(result, false);
    }

    Lottery.state.isAnimating = false;
  }, animDuration);
}

// 网格背景
(function() {
  var c = document.getElementById('gridCanvas');
  var ctx = c.getContext('2d');
  var w, h;

  function resize() {
    w = c.width = window.innerWidth;
    h = c.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  function drawGrid() {
    ctx.clearRect(0, 0, w, h);

    var horizonY = h * 0.58;
    var vanishX = w * 0.5;
    var cellCount = 24;
    var maxDepth = 70;
    var baseAlpha = reducedMotion ? 0.08 : 0.18;

    for (var depth = 1; depth <= maxDepth; depth++) {
      var t = depth / maxDepth;
      var ty = horizonY + (h - horizonY) * Math.pow(t, 1.6);
      if (ty > h + 2) break;

      var alpha = baseAlpha * (1 - t) * 0.9;
      var lineW = 0.5 + (1 - t) * 1.0;

      ctx.beginPath();
      ctx.moveTo(0, ty);
      ctx.lineTo(w, ty);
      ctx.strokeStyle = 'rgba(157,78,221,' + alpha + ')';
      ctx.lineWidth = lineW;
      ctx.stroke();
    }

    for (var i = -cellCount; i <= cellCount; i++) {
      var angle = (i / cellCount) * (Math.PI / 3);
      var dx = Math.sin(angle);
      var alpha = baseAlpha * 0.7;

      ctx.beginPath();
      ctx.moveTo(vanishX, horizonY);
      var endX = vanishX + dx * (h - horizonY) * 3;
      ctx.lineTo(endX, h);
      ctx.strokeStyle = 'rgba(0,245,255,' + alpha + ')';
      ctx.lineWidth = 0.4;
      ctx.stroke();
    }
  }

  function loop() {
    drawGrid();
    requestAnimationFrame(loop);
  }
  loop();
})();

// 数字雨背景
(function() {
  var c = document.getElementById('rainCanvas');
  var ctx = c.getContext('2d');
  var w, h;
  var drops = [];
  var DROP_COUNT = 40;

  function resize() {
    w = c.width = window.innerWidth;
    h = c.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  var chars = '01';
  for (var i = 0; i < DROP_COUNT; i++) {
    drops.push({
      x: Math.random() * w,
      y: Math.random() * h,
      speed: Math.random() * 0.6 + 0.2,
      char: chars[Math.floor(Math.random() * chars.length)],
      alpha: Math.random() * 0.15 + 0.05,
      color: Math.random() < 0.6 ? '157,78,221' : '0,245,255'
    });
  }

  function drawRain() {
    ctx.clearRect(0, 0, w, h);
    ctx.font = '12px "Courier New", monospace';

    if (reducedMotion) {
      for (var i = 0; i < drops.length; i++) {
        var d = drops[i];
        ctx.fillStyle = 'rgba(' + d.color + ',' + (d.alpha * 0.5) + ')';
        ctx.fillText(d.char, d.x, d.y);
      }
      return;
    }

    for (var i = 0; i < drops.length; i++) {
      var d = drops[i];
      ctx.fillStyle = 'rgba(' + d.color + ',' + d.alpha + ')';
      ctx.fillText(d.char, d.x, d.y);
      d.y += d.speed;
      if (d.y > h + 20) {
        d.y = -20;
        d.x = Math.random() * w;
      }
    }
  }

  function loop() {
    drawRain();
    requestAnimationFrame(loop);
  }
  loop();
})();

// H: 初始化
// ============================================================
(function() {
  // 弹出关闭
  document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
  document.getElementById('modalOverlay').addEventListener('click', function(e) {
    if (e.target === this) closeModal();
  });

  // 海报按钮
  document.getElementById('modalPosterBtn').addEventListener('click', generatePoster);

  // 隐藏签关闭（点击覆盖层背景）
  document.getElementById('hiddenOverlay').addEventListener('click', function(e) {
    if (e.target === this) {
      document.getElementById('hiddenCloseBtn').click();
    }
  });

  // ESC 关闭
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') {
      var hiddenOvl = document.getElementById('hiddenOverlay');
      var modalOvl = document.getElementById('modalOverlay');
      if (hiddenOvl.classList.contains('active')) {
        document.getElementById('hiddenCloseBtn').click();
      } else if (modalOvl.classList.contains('active')) {
        closeModal();
      }
    }
  });

  // 卡片点击
  var cards = document.querySelectorAll('.card');
  for (var i = 0; i < cards.length; i++) {
    (function(card) {
      card.addEventListener('click', function() {
        var type = card.getAttribute('data-type');
        if (type) handleCardClick(type);
      });
    })(cards[i]);
  }

  // 初始化计数器
  updateCounter();
})();
</script>
